name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-invariants:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Install locked staging authority test dependencies
        run: npm ci --prefix apps/operations

      - name: Verify repository contracts
        run: node --test scripts/source-layout-invariants.test.mjs scripts/client-portal-joined-acceptance.test.mjs scripts/client-portal-rollout-manifest.test.mjs scripts/client-portal-release-profile.test.mjs scripts/staging-cloudflare-d1-target.test.mjs scripts/staging-native-migration-profile.test.mjs scripts/staging-project-alpha-api-v2-acceptance-profile.test.mjs scripts/staging-project-alpha-api-v2-viewer-acceptance-profile.test.mjs scripts/staging-project-alpha-directory-adoption-acceptance-profile.test.mjs scripts/staging-directory-writes-acceptance-profile.test.mjs scripts/staging-paired-end-to-end-acceptance-profile.test.mjs scripts/staging-native-workspace-acceptance-cli.test.mjs scripts/staging-directory-nonmutation-snapshot-verifier.test.mjs scripts/native-recipient-route-mount.test.mjs scripts/native-delivery-migration-evidence.test.mjs scripts/pa-api-v2-staging-acceptance.test.mjs scripts/pa-api-v2-directory-staging-acceptance.test.mjs scripts/ops-project-v2-joined-live-acceptance.test.mjs scripts/ops-directory-v2-joined-live-acceptance.test.mjs

      - name: Verify non-deploying paired staging config generator
        run: node --test scripts/staging-paired-end-to-end-acceptance-cli.test.mjs

      - name: Verify isolated Project adoption finalization staging window
        run: node --test scripts/staging-project-alpha-project-adoption-finalization-acceptance-profile.test.mjs scripts/staging-project-adoption-live-settings-preservation.test.mjs scripts/staging-project-adoption-live-settings-profile.test.mjs scripts/staging-pa-native-portal-acceptance-profile.test.mjs scripts/staging-pa-native-portal-acceptance-cli.test.mjs

      - name: Verify exact live staging settings preservation
        run: node --test scripts/staging-paired-live-settings-preservation.test.mjs

      - name: Verify non-deploying staging release gates
        run: node --test scripts/staging-preflight.test.mjs scripts/staging-bootstrap.test.mjs scripts/staging-evidence.test.mjs scripts/staging-acceptance.test.mjs scripts/staging-native-client-onboarding-acceptance-profile.test.mjs scripts/staging-ops-project-v2-joined-acceptance-profile.test.mjs

      - name: Verify governed staging authority packets locally
        run: node --test scripts/staging-native-authority-packet.test.mjs scripts/staging-bounded-guards.test.mjs scripts/staging-onboarding-authority-packet.test.mjs scripts/staging-native-authority-window.test.mjs

      - name: Verify retained staging authority and paired cleanup locally
        run: node --test scripts/staging-retained-directory-authority.test.mjs scripts/staging-retained-directory-authority-window.test.mjs scripts/staging-retained-directory-authority-fullschema.test.mjs

      - name: Verify exact organization staging authority and paired cleanup locally
        run: node --test scripts/staging-organization-relationship-authority.test.mjs scripts/staging-organization-relationship-authority-window.test.mjs scripts/staging-organization-relationship-authority-fullschema.test.mjs

      - name: Verify scoped Project staging authority and recipient readback locally
        run: node --test scripts/staging-project-business-area-authority-packet.test.mjs scripts/staging-recipient-authority-readback.test.mjs

      - name: Verify staging portal byte fixtures without remote writes
        run: node --test scripts/staging-portal-byte-fixture.test.mjs

      - name: Verify local relationship recovery proposal against the canonical schema
        run: node --test scripts/staging-directory-relationship-recovery-proposal.test.mjs

      - name: Verify bounded v184 relationship recovery authority and release configuration locally
        run: node --test scripts/staging-relationship-generation-recovery-authority-v184.test.mjs scripts/staging-relationship-generation-recovery-authority-v184-window.test.mjs scripts/staging-relationship-generation-recovery-authority-v184-fullschema.test.mjs scripts/staging-relationship-recovery-release-config.test.mjs

      - name: Verify closed-lineage Project authority and paired cleanup locally
        run: node --test scripts/staging-project-business-area-authority-v184.test.mjs scripts/staging-project-business-area-authority-v184-apply.test.mjs scripts/staging-project-business-area-authority-v184-fullschema.test.mjs

      - name: Verify ordinary Directory scalar settlement and cleanup locally
        run: node --test scripts/staging-directory-scalar-settlement.test.mjs scripts/staging-directory-scalar-settlement-fullschema.test.mjs

  incoming-pickup:
    name: incoming-pickup-alpine
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Verify pickup source and Linux fixtures
        run: |
          bash -n scripts/truenas/incoming-pickup-worker.sh
          bash -n scripts/truenas/incoming-pickup-alpine.test.sh
          node --test scripts/truenas/incoming-pickup-worker.test.mjs
          python3 -B scripts/truenas/incoming-zip-inventory.test.py
          python3 -B scripts/truenas/incoming-zip-receipts.test.py

      - name: Build the pinned TrueNAS pickup image
        run: docker build -f scripts/truenas/incoming-pickup.Dockerfile -t ledgetop-incoming-pickup:ci .

      - name: Verify Alpine musl no-replace promotion
        run: >-
          docker run --rm
          -v "$PWD/scripts/truenas/incoming-pickup-alpine.test.sh:/tmp/incoming-pickup-alpine.test.sh:ro"
          --entrypoint /bin/bash
          ledgetop-incoming-pickup:ci
          /tmp/incoming-pickup-alpine.test.sh

  packages:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [client, operations, ops-sync, thumbnail-renderer]
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Install linked application dependencies
        if: matrix.package != 'thumbnail-renderer'
        run: |
          npm --prefix apps/client ci
          npm --prefix apps/operations ci
          npm --prefix apps/ops-sync ci

      - name: Typecheck
        working-directory: apps/${{ matrix.package }}
        run: npm run check

      - name: Test
        working-directory: apps/${{ matrix.package }}
        run: npm test

      - name: Build deployable application
        if: matrix.package != 'thumbnail-renderer'
        working-directory: apps/${{ matrix.package }}
        run: npm run build

  operations-browser:
    name: operations-browser-${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-edge, mobile-edge]
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Install linked application dependencies
        run: |
          npm --prefix apps/client ci
          npm --prefix apps/operations ci
          npm --prefix apps/ops-sync ci

      - name: Install Microsoft Edge
        working-directory: apps/operations
        run: npx playwright install --with-deps msedge

      - name: Run Operations browser acceptance suite
        working-directory: apps/operations
        run: npm run test:browser -- --project=${{ matrix.project }} --workers=2

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operations-browser-${{ matrix.project }}-${{ github.sha }}
          path: apps/operations/test-results
          if-no-files-found: ignore
          retention-days: 14

  client-browser:
    name: client-browser-${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-edge
            form-factor: desktop
          - project: mobile-edge
            form-factor: mobile
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Install linked application dependencies
        run: |
          npm --prefix apps/client ci
          npm --prefix apps/operations ci
          npm --prefix apps/ops-sync ci

      - name: Install Microsoft Edge
        working-directory: apps/client
        run: npx playwright install --with-deps msedge

      - name: Build Client Portal browser fixture
        working-directory: apps/client
        run: npm run build

      - name: Run Client Portal browser acceptance suite
        working-directory: apps/client
        run: npx playwright test --config playwright.config.ts --project=${{ matrix.project }} --workers=2

      - name: Run dual-domain Client Portal acceptance suite
        working-directory: apps/client
        run: npx playwright test --config playwright.j7.config.ts --project=drone-${{ matrix.form-factor }} --project=technology-${{ matrix.form-factor }} --workers=2

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-browser-${{ matrix.project }}-${{ github.sha }}
          path: apps/client/test-results
          if-no-files-found: ignore
          retention-days: 14
