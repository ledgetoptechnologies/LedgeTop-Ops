name: Deploy Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/operations/**
      - apps/client/**
      - packages/shared/**
      - .github/workflows/deploy-workers.yml

concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-operations:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea39d1df2b7481f1f1de # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@4993395c1d047ace5743243e7c1c018a3df2f7f6 # v4.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm --prefix packages/shared run build

      - name: Build operations
        run: npm --prefix apps/operations run build

      - name: Deploy ltds-ops
        working-directory: apps/operations
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-client:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11bd7195c1d047ace5743e7c1c018a3df2f7f6 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@4993395c1d047ace5743e7c1c018a3df2f7f6 # v4.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm --prefix packages/shared run build

      - name: Build client
        run: npm --prefix apps/client run build

      - name: Deploy ltds-clients
        working-directory: apps/client
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}