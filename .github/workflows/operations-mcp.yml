name: Private Operations MCP

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - 'apps/operations-mcp/**'
      - '.github/workflows/operations-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'apps/operations-mcp/**'
      - '.github/workflows/operations-mcp.yml'

permissions:
  contents: read

jobs:
  mcp:
    # Drafts and branches other than main are tested on staging, not on GitHub minutes.
    # An edit only counts when it moves the pull request onto main (retargeted from a stacked base).
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null)) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: apps/operations-mcp
      - run: npm run check && npm test
        working-directory: apps/operations-mcp
