name: Publish TrueNAS thumbnail renderer images

# A push to main verifies, builds and publishes immutable sha and candidate tags for each image, then the promote-latest job
# moves each image's `latest` to that exact verified digest (never back to an older main commit). The hand-run
# promote-thumbnail-renderer.yml stays the rollback and re-promotion path.

on:
  push:
    branches: [main]
    paths:
      - apps/thumbnail-renderer/**
      - .github/workflows/publish-thumbnail-renderer.yml

concurrency:
  group: publish-thumbnail-renderer-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the renderer's supported Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Check renderer source and policy tests
        run: |
          npm --prefix apps/thumbnail-renderer run check
          npm --prefix apps/thumbnail-renderer test

  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [decoder, broker, queue-worker]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.names.outputs.image }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the renderer's supported Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Resolve the package name
        id: names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/thumbnail-${{ matrix.target }}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${image}:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing commit tag
        shell: bash
        run: |
          if docker buildx imagetools inspect "${{ steps.names.outputs.tag }}" >/dev/null 2>&1; then
            echo "The immutable commit tag already exists: ${{ steps.names.outputs.tag }}" >&2
            exit 1
          fi

      - name: Build and publish the linux/amd64 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/thumbnail-renderer
          file: apps/thumbnail-renderer/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.names.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Thumbnail ${{ matrix.target }}
          provenance: mode=max
          sbom: true

      - name: Verify immutable commit tag digest
        shell: bash
        env:
          TAG: ${{ steps.names.outputs.tag }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            if docker buildx imagetools inspect "${TAG}" --format '{{json .Manifest}}' > commit-manifest.json; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 2
          done
          resolved_digest="$(node -p 'JSON.parse(require("node:fs").readFileSync("commit-manifest.json", "utf8")).digest')"
          if [[ -z "${EXPECTED_DIGEST}" || -z "${resolved_digest}" || "${resolved_digest}" != "${EXPECTED_DIGEST}" ]]; then
            echo "Published immutable tag did not resolve to the build output digest." >&2
            exit 1
          fi

      - name: Prove the exact published all-media queue image
        if: matrix.target == 'queue-worker'
        env:
          LTDSTHUMB_SMOKE_IMAGE: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
        run: npm --prefix apps/thumbnail-renderer run test:video-worker-container

      - name: Tag the verified digest as an immutable candidate (never latest)
        shell: bash
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # This step writes an immutable candidate tag only; latest moves in the promote-latest job, after this whole job passed.
          tag="candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --prefer-index=false --tag "${IMAGE}:${tag}" "${IMAGE}@${EXPECTED_DIGEST}"
          docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest}}' > candidate-manifest.json
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("candidate-manifest.json","utf8")); if(m.digest !== process.env.EXPECTED_DIGEST) throw new Error("candidate digest does not match verified main image")'

      - name: Write the immutable deployment receipt
        id: receipt
        shell: bash
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
        run: |
          receipt="thumbnail-renderer-${TARGET}-${GITHUB_SHA}.json"
          jq -n \
            --arg target "${TARGET}" \
            --arg platform "linux/amd64" \
            --arg commit "${GITHUB_SHA}" \
            --arg image "${IMAGE}" \
            --arg digest "${DIGEST}" \
            --arg reference "${IMAGE}@${DIGEST}" \
            --arg deploymentReference "${IMAGE}:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            '{schemaVersion:1,target:$target,platform:$platform,commit:$commit,image:$image,digest:$digest,reference:$reference,deploymentReference:$deploymentReference}' \
            > "${receipt}"
          echo "path=${receipt}" >> "${GITHUB_OUTPUT}"
          {
            echo "### TrueNAS thumbnail ${TARGET} image"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Verified immutable candidate: target \`${TARGET}\`, commit \`${GITHUB_SHA}\`, digest \`${DIGEST}\`. Pin by digest \`${IMAGE}@${DIGEST}\` (never the sha tag); the promote-latest job moves latest to it."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the deployment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thumbnail-renderer-${{ matrix.target }}-${{ github.sha }}
          path: ${{ steps.receipt.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  promote-latest:
    # Moves latest to the build verified above. It shares the writer concurrency group for this tag with the hand-run
    # promote-thumbnail-renderer.yml, so automatic and manual writes never interleave; no environment, so it never waits for approval.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [decoder, broker, queue-worker]
    concurrency:
      group: latest-writer-thumbnail-${{ matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download this image's verified receipt from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thumbnail-renderer-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/verified-receipt

      - name: Read the verified digest from the receipt
        id: verified
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/verified-receipt/thumbnail-renderer-${TARGET}-${GITHUB_SHA}.json"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/thumbnail-${TARGET}"
          jq -e --arg commit "$GITHUB_SHA" --arg image "$image" --arg target "$TARGET" \
            '.schemaVersion == 1 and .target == $target and .commit == $commit and .image == $image and .reference == ($image + "@" + .digest)' "$receipt" >/dev/null
          { echo "image=$image"; echo "digest=$(jq -er .digest "$receipt")"; } >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR to move latest
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest to this verified main build (never to an older commit)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_PROMOTE_LATEST_PAUSED: ${{ vars.AUTO_PROMOTE_LATEST_PAUSED }}
          IMAGE_NAME: ${{ steps.verified.outputs.image }}
          IMMUTABLE_TAG: ${{ steps.verified.outputs.image }}:sha-${{ github.sha }}
          PROMOTE_DIGEST: ${{ steps.verified.outputs.digest }}
        run: |
          set -euo pipefail
          # Like Project-Alpha, a main push moves latest in the same run that built the image, but only here: after the
          # publishing job (every verify and test step) passed, to its exact digest, and only forward from whatever latest
          # names at write time. This job and the hand-run promote workflow share one writer concurrency group for this
          # tag, so the reads, compare, write and read-back below never interleave with another writer of it. A manual
          # rollback lasts until the next automatic write; to keep one, revert on main or set the repository variable
          # AUTO_PROMOTE_LATEST_PAUSED to true, which this job reads once it holds the lock.
          fail() { echo "::error::$1 latest was not changed."; exit 1; }
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' | tr -d '"'; }
          revision_of() { docker buildx imagetools inspect "$1" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}'; }
          # Prints latest's digest, or "absent" only for the registry's exact one-line answer for this missing tag.
          # Any other failure (auth, network, rate limit, server error, other wording) returns non-zero.
          read_latest() {
            local ref="$IMAGE_NAME:latest" out line
            if out="$(digest_of "$ref" 2>"$RUNNER_TEMP/latest-error.txt")"; then printf '%s' "$out"; return 0; fi
            line="$(tr -d '\r' < "$RUNNER_TEMP/latest-error.txt" | grep . || true)"
            if [[ "$line" == "ERROR: $ref: not found" || "$line" == "ERROR: $ref: MANIFEST_UNKNOWN: manifest unknown" \
              || "$line" == "ERROR: $ref: MANIFEST_UNKNOWN: manifest unknown; map[Tag:latest]" ]]; then
              printf absent; return 0
            fi
            cat "$RUNNER_TEMP/latest-error.txt" >&2
            return 1
          }
          COMMIT="$GITHUB_SHA"
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] || fail "Only a push to main moves latest."
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$PROMOTE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "No verified commit and digest."
          [[ "$IMMUTABLE_TAG" == "$IMAGE_NAME:sha-$COMMIT" || "$IMMUTABLE_TAG" == "$IMAGE_NAME:sha-$COMMIT-full" ]] || fail "Unexpected immutable tag $IMMUTABLE_TAG."
          [[ "$(digest_of "$IMMUTABLE_TAG")" == "$PROMOTE_DIGEST" ]] || fail "$IMMUTABLE_TAG does not name the verified $PROMOTE_DIGEST."
          [[ "$(revision_of "$IMAGE_NAME@$PROMOTE_DIGEST")" == "$COMMIT" ]] || fail "The verified digest does not carry commit $COMMIT."
          # Hold switch, read under the lock: "true" pauses automatic promotion; unset or "false" runs; anything else stops.
          case "$AUTO_PROMOTE_LATEST_PAUSED" in
            true)
              echo "- Automatic promotion of \`$IMAGE_NAME:latest\` is paused (AUTO_PROMOTE_LATEST_PAUSED=true); commit \`$COMMIT\`, digest \`$PROMOTE_DIGEST\` was not promoted." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Automatic promotion is paused by AUTO_PROMOTE_LATEST_PAUSED; latest was not changed."
              exit 0 ;;
            ''|false) ;;
            *) fail "AUTO_PROMOTE_LATEST_PAUSED must be true, false or unset, not '$AUTO_PROMOTE_LATEST_PAUSED'." ;;
          esac
          PREVIOUS_DIGEST="$(read_latest)" || fail "Cannot read the current latest."
          PREVIOUS_COMMIT=none
          if [[ "$PREVIOUS_DIGEST" == "$PROMOTE_DIGEST" ]]; then
            DECISION=already-latest
          elif [[ "$PREVIOUS_DIGEST" == absent ]]; then
            DECISION=create
          else
            [[ "$PREVIOUS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "The current latest digest is malformed: $PREVIOUS_DIGEST."
            PREVIOUS_COMMIT="$(revision_of "$IMAGE_NAME@$PREVIOUS_DIGEST")" || fail "Cannot read the commit of the current latest."
            [[ "$PREVIOUS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "The current latest carries no commit label; promote it once by hand."
            # ahead: this commit descends from the one latest names now. behind: latest is already newer on main.
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$PREVIOUS_COMMIT...$COMMIT" --jq .status)" || fail "Cannot compare $PREVIOUS_COMMIT with $COMMIT."
            case "$STATUS" in
              ahead) DECISION=promote ;;
              behind) DECISION=kept-newer ;;
              *) fail "latest names $PREVIOUS_COMMIT, which is not an older main commit than $COMMIT ($STATUS)." ;;
            esac
          fi
          {
            echo "### Automatic promotion of \`$IMAGE_NAME:latest\`"
            echo "- Commit: \`$COMMIT\`"
            echo "- Digest: \`$PROMOTE_DIGEST\`"
            echo "- Previous latest: \`$PREVIOUS_DIGEST\` (commit \`$PREVIOUS_COMMIT\`)"
            echo "- Decision: $DECISION"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$DECISION" in
            kept-newer) echo "::warning::latest already names $PREVIOUS_COMMIT, which is newer on main than $COMMIT; latest is never moved back automatically."; exit 0 ;;
            already-latest) exit 0 ;;
          esac
          NOW="$(read_latest)" || fail "Cannot re-read latest before the write."
          [[ "$NOW" == "$PREVIOUS_DIGEST" ]] || fail "latest changed while this step ran (was $PREVIOUS_DIGEST, now $NOW)."
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:latest" "$IMAGE_NAME@$PROMOTE_DIGEST"
          if [[ "$(digest_of "$IMAGE_NAME:latest")" != "$PROMOTE_DIGEST" ]]; then
            echo "::error::latest could not be confirmed as $PROMOTE_DIGEST. Roll back with the manual promote workflow (previous: $PREVIOUS_DIGEST, commit $PREVIOUS_COMMIT)."
            exit 1
          fi
          echo "- Result: latest now names \`$PROMOTE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
