name: Publish TrueNAS thumbnail renderer images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/thumbnail-renderer/**
      - .github/workflows/publish-thumbnail-renderer.yml

concurrency:
  group: publish-thumbnail-renderer-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [decoder, broker]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.names.outputs.image }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the package name
        id: names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ltds-thumbnail-${{ matrix.target }}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${image}:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing commit tag
        shell: bash
        run: |
          if docker buildx imagetools inspect "${{ steps.names.outputs.tag }}" >/dev/null 2>&1; then
            echo "The immutable commit tag already exists: ${{ steps.names.outputs.tag }}" >&2
            exit 1
          fi

      - name: Build and publish the linux/amd64 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/thumbnail-renderer
          file: apps/thumbnail-renderer/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.names.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=LTDS thumbnail ${{ matrix.target }}
          provenance: mode=max
          sbom: true

      - name: Write the immutable deployment receipt
        id: receipt
        shell: bash
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
        run: |
          receipt="thumbnail-renderer-${TARGET}-${GITHUB_SHA}.json"
          jq -n \
            --arg target "${TARGET}" \
            --arg platform "linux/amd64" \
            --arg commit "${GITHUB_SHA}" \
            --arg image "${IMAGE}" \
            --arg digest "${DIGEST}" \
            --arg reference "${IMAGE}@${DIGEST}" \
            '{schemaVersion:1,target:$target,platform:$platform,commit:$commit,image:$image,digest:$digest,reference:$reference}' \
            > "${receipt}"
          echo "path=${receipt}" >> "${GITHUB_OUTPUT}"
          {
            echo "### TrueNAS thumbnail ${TARGET} image"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- TrueNAS image: \`${IMAGE}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the deployment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thumbnail-renderer-${{ matrix.target }}-${{ github.sha }}
          path: ${{ steps.receipt.outputs.path }}
          if-no-files-found: error
          retention-days: 30
