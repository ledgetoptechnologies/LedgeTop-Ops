name: Production automatic frontend and backend release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  release:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.repository.full_name == 'ledgetoptechnologies/LedgeTop-Ops' && github.event.workflow_run.head_repository.full_name == 'ledgetoptechnologies/LedgeTop-Ops' && vars.PRODUCTION_AUTO_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: ledgetop-ops
            app: operations
          - worker: ledgetop-clients
            app: client
          - worker: ledgetop-ops-sync
            app: ops-sync
    concurrency:
      group: production-auto-${{ matrix.worker }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the exact successful main CI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Install locked application build dependencies
        run: |
          npm ci --prefix apps/${{ matrix.app }}

      - name: Run exact-main CI-fenced release
        id: release
        env:
          PRODUCTION_AUTO_RELEASE_ENABLED: ${{ vars.PRODUCTION_AUTO_RELEASE_ENABLED }}
          PRODUCTION_AUTO_WORKER: ${{ matrix.worker }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: 846c924bf17bf4f3dd15c97a4c5d1d51
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NATIVE_STAFF_CUTOVER_REVIEW_JSON: ${{ secrets.NATIVE_STAFF_CUTOVER_REVIEW_JSON }}
        run: |
          if [ "${{ matrix.worker }}" = "ledgetop-ops-sync" ]; then
            node scripts/production-auto-sync-runtime.mjs
          else
            node scripts/production-auto-runtime.mjs
          fi

      - name: Upload only sealed provider responses
        id: upload
        if: ${{ always() && steps.release.outputs.release_id != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-auto-${{ steps.release.outputs.release_id }}
          path: .backups/production-auto-release/${{ matrix.worker }}/${{ github.event.workflow_run.head_sha }}/responses/*.sealed.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          include-hidden-files: true

      - name: Bind encrypted artifact id and digest to the durable journal
        id: journal
        if: ${{ always() && steps.upload.outputs.artifact-id != '' }}
        env:
          PRODUCTION_AUTO_RELEASE_ENABLED: ${{ vars.PRODUCTION_AUTO_RELEASE_ENABLED }}
          PRODUCTION_AUTO_WORKER: ${{ matrix.worker }}
          GITHUB_TOKEN: ${{ github.token }}
          AUTO_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          AUTO_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          AUTO_UPLOAD_CONCLUSION: ${{ steps.upload.outcome }}
          AUTO_RELEASE_CONCLUSION: ${{ steps.release.outcome }}
        run: node scripts/production-auto-journal-artifact.mjs

      - name: Require durable release artifact association
        if: ${{ always() && steps.release.outcome == 'success' }}
        env:
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          JOURNAL_OUTCOME: ${{ steps.journal.outcome }}
        run: |
          test "$RELEASE_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success
          test "$JOURNAL_OUTCOME" = success
