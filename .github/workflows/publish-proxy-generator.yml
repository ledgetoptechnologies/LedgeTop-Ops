name: Verify and publish Resolve proxy generator

# A push to main builds, canary-tests and publishes immutable sha and candidate tags, then, as its last step, moves
# `latest` to that exact digest (never back to an older main commit). promote-proxy-generator.yml stays the hand-run,
# approved path for rollback or re-promotion.

on:
  push:
    branches: [main]
    paths:
      - apps/proxy-generator/**
      - apps/media-generation/**
      - .github/workflows/publish-proxy-generator.yml

concurrency:
  group: proxy-generator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-publish:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the deployable runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/proxy-generator
          target: production
          platforms: linux/amd64
          load: true
          push: false
          tags: proxy-generator:canary
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Run regression and synthetic media tests in the runtime
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 256
          --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777
          --mount type=bind,source="$PWD/apps/proxy-generator/tests",target=/app/tests,readonly
          --entrypoint python3 proxy-generator:canary
          -B -m unittest discover -s tests -v

      - name: Validate combined stack without credentials or host mounts
        run: python3 apps/media-generation/test_compose.py

      - name: Verify first start creates shared dataset folders as 568
        run: python3 apps/media-generation/test_empty_dataset.py --proxy-image proxy-generator:canary

      - name: Authenticate to GHCR for main publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only the canary-tested image and retain its digest
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/proxy-generator"
          tag="${image}:sha-${GITHUB_SHA}"
          if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing commit tag.' >&2
            exit 1
          fi
          docker tag proxy-generator:canary "$tag"
          docker push "$tag"
          docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' > proxy-manifest.json
          digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' proxy-manifest.json)
          # This step writes immutable sha and candidate tags only; latest moves in the last step, after this whole job passed.
          candidate="${image}:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --prefer-index=false --tag "$candidate" "${image}@${digest}"
          candidate_digest=$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' | jq -er '.digest')
          if [[ "$candidate_digest" != "$digest" ]]; then
            echo 'candidate digest does not match the canary-tested proxy image.' >&2
            exit 1
          fi
          jq -n --arg commit "$GITHUB_SHA" --arg image "$image" --arg digest "$digest" \
            --arg reference "${image}@${digest}" --arg deploymentReference "$candidate" \
            '{schemaVersion:1,platform:"linux/amd64",commit:$commit,image:$image,digest:$digest,reference:$reference,deploymentReference:$deploymentReference}' \
            > proxy-generator-release.json
          { echo "image=${image}"; echo "digest=${digest}"; } >> "$GITHUB_OUTPUT"
          echo "Published canary-tested immutable candidate: ${candidate} (${digest}). Pin by digest ${image}@${digest} (never the sha tag); latest moves to it at the end of this run." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable deployment receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxy-generator-${{ github.sha }}
          path: proxy-generator-release.json
          if-no-files-found: error
          retention-days: 30

      - name: Move latest to this verified main build (never to an older commit)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ steps.publish.outputs.image }}
          IMMUTABLE_TAG: ${{ steps.publish.outputs.image }}:sha-${{ github.sha }}
          PROMOTE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          # Like Project-Alpha, a main push moves latest in the same run that built the image, but only here: after
          # every verify and test step above passed, to this exact digest, and never back to an older main commit.
          # Rollback or re-promotion is the hand-run promote workflow. The re-read below is not an atomic swap.
          fail() { echo "::error::$1 latest was not changed."; exit 1; }
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' | tr -d '"'; }
          revision_of() { docker buildx imagetools inspect "$1" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}'; }
          COMMIT="$GITHUB_SHA"
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] || fail "Only a push to main moves latest."
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$PROMOTE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "No verified commit and digest."
          [[ "$IMMUTABLE_TAG" == "$IMAGE_NAME:sha-$COMMIT" || "$IMMUTABLE_TAG" == "$IMAGE_NAME:sha-$COMMIT-full" ]] || fail "Unexpected immutable tag $IMMUTABLE_TAG."
          [[ "$(digest_of "$IMMUTABLE_TAG")" == "$PROMOTE_DIGEST" ]] || fail "$IMMUTABLE_TAG does not name the verified $PROMOTE_DIGEST."
          [[ "$(revision_of "$IMAGE_NAME@$PROMOTE_DIGEST")" == "$COMMIT" ]] || fail "The verified digest does not carry commit $COMMIT."
          if ! PREVIOUS_DIGEST="$(digest_of "$IMAGE_NAME:latest" 2>"$RUNNER_TEMP/latest-error.txt")"; then
            # Absent only on GHCR's exact one-line answer for this tag; any other error stops here.
            [[ "$(tr -d '\r' < "$RUNNER_TEMP/latest-error.txt" | grep .)" == "ERROR: $IMAGE_NAME:latest: not found" ]] ||
              { cat "$RUNNER_TEMP/latest-error.txt" >&2; fail "Cannot read the current latest."; }
            PREVIOUS_DIGEST=absent
          fi
          PREVIOUS_COMMIT=none
          if [[ "$PREVIOUS_DIGEST" == "$PROMOTE_DIGEST" ]]; then
            DECISION=already-latest
          elif [[ "$PREVIOUS_DIGEST" == absent ]]; then
            DECISION=create
          else
            [[ "$PREVIOUS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "The current latest digest is malformed: $PREVIOUS_DIGEST."
            PREVIOUS_COMMIT="$(revision_of "$IMAGE_NAME@$PREVIOUS_DIGEST")" || fail "Cannot read the commit of the current latest."
            [[ "$PREVIOUS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "The current latest carries no commit label; promote it once by hand."
            # ahead: this commit descends from the one latest names. behind: latest is already newer on main.
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$PREVIOUS_COMMIT...$COMMIT" --jq .status)" || fail "Cannot compare $PREVIOUS_COMMIT with $COMMIT."
            case "$STATUS" in
              ahead) DECISION=promote ;;
              behind) DECISION=kept-newer ;;
              *) fail "latest names $PREVIOUS_COMMIT, which is not an older main commit than $COMMIT ($STATUS)." ;;
            esac
          fi
          {
            echo "### Automatic promotion of \`$IMAGE_NAME:latest\`"
            echo "- Commit: \`$COMMIT\`"
            echo "- Digest: \`$PROMOTE_DIGEST\`"
            echo "- Previous latest: \`$PREVIOUS_DIGEST\` (commit \`$PREVIOUS_COMMIT\`)"
            echo "- Decision: $DECISION"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DECISION" == kept-newer ]]; then
            echo "::warning::latest already names $PREVIOUS_COMMIT, which is newer on main than $COMMIT; latest is never moved back automatically."
            exit 0
          fi
          if [[ "$DECISION" == already-latest ]]; then exit 0; fi
          NOW="$(digest_of "$IMAGE_NAME:latest" 2>/dev/null || echo absent)"
          [[ "$NOW" == "$PREVIOUS_DIGEST" ]] || fail "latest changed while this step ran (was $PREVIOUS_DIGEST, now $NOW)."
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:latest" "$IMAGE_NAME@$PROMOTE_DIGEST"
          if [[ "$(digest_of "$IMAGE_NAME:latest")" != "$PROMOTE_DIGEST" ]]; then
            echo "::error::latest could not be confirmed as $PROMOTE_DIGEST. Roll back with the manual promote workflow (previous: $PREVIOUS_DIGEST, commit $PREVIOUS_COMMIT)."
            exit 1
          fi
          echo "- Result: latest now names \`$PROMOTE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
