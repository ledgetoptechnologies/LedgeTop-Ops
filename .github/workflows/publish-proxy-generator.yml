name: Verify and publish Resolve proxy generator

on:
  push:
    branches: [main]
    paths:
      - apps/proxy-generator/**
      - apps/media-generation/**
      - .github/workflows/publish-proxy-generator.yml

concurrency:
  group: proxy-generator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-publish:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the deployable runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/proxy-generator
          target: production
          platforms: linux/amd64
          load: true
          push: false
          tags: proxy-generator:canary
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Run regression and synthetic media tests in the runtime
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 256
          --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777
          --mount type=bind,source="$PWD/apps/proxy-generator/tests",target=/app/tests,readonly
          --entrypoint python3 proxy-generator:canary
          -B -m unittest discover -s tests -v

      - name: Validate combined stack without credentials or host mounts
        run: python3 apps/media-generation/test_compose.py

      - name: Verify first start creates shared dataset folders as 568
        run: python3 apps/media-generation/test_empty_dataset.py --proxy-image proxy-generator:canary

      - name: Authenticate to GHCR for main publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only the canary-tested image and retain its digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/proxy-generator"
          tag="${image}:sha-${GITHUB_SHA}"
          if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing commit tag.' >&2
            exit 1
          fi
          docker tag proxy-generator:canary "$tag"
          docker push "$tag"
          docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' > proxy-manifest.json
          digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' proxy-manifest.json)
          docker buildx imagetools create --prefer-index=false --tag "${image}:latest" "${image}@${digest}"
          latest_digest=$(docker buildx imagetools inspect "${image}:latest" --format '{{json .Manifest}}' | jq -er '.digest')
          if [[ "$latest_digest" != "$digest" ]]; then
            echo 'latest digest does not match the canary-tested proxy image.' >&2
            exit 1
          fi
          jq -n --arg commit "$GITHUB_SHA" --arg image "$image" --arg digest "$digest" \
            --arg reference "${image}@${digest}" --arg deploymentReference "${image}:latest" \
            '{schemaVersion:1,platform:"linux/amd64",commit:$commit,image:$image,digest:$digest,reference:$reference,deploymentReference:$deploymentReference}' \
            > proxy-generator-release.json
          echo "Published canary-tested main release: ${image}:latest (${digest})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable deployment receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxy-generator-${{ github.sha }}
          path: proxy-generator-release.json
          if-no-files-found: error
          retention-days: 30
