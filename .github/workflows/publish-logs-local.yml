name: Publish Logs local host images (keyless and full)

# Main only. No manual, pull-request, tag or other-branch triggers: every published image is exactly a main commit.
# Two independent images per commit: keyless (no native DJI parser) and full (keyless plus the reviewed native parser,
# built from an immutable Rust base by digest and the pinned upstream revision). Each has its own immutable commit tag,
# its own exact-digest smoke, and its own immutable candidate tag (candidate-<commit>-<run>-<attempt>-<target>). Only
# the promote-latest job moves latest (what the NAS stack pulls), after its smoke passed, to that exact full digest and
# never back to an older main commit. The hand-run promote-logs-local.yml stays the rollback and re-promotion path. A
# keyless image is never promoted as full or latest. Compiling and smoking the parser does NOT prove real DJI decoding.
on:
  push:
    branches: [main]
    paths:
      - apps/logs-local/**
      - apps/logs/src/worker/**
      - apps/logs/src/odl/map.mjs
      - apps/logs/src/odl/util.mjs
      - apps/logs/src/odl/contract.mjs
      - apps/logs/migrations/**
      - apps/logs-decoder/src/**
      - apps/logs-decoder/parser/**
      - .github/workflows/publish-logs-local.yml

concurrency:
  group: publish-logs-local-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the Logs host's Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Logs local host tests
        run: npm --prefix apps/logs-local test

  publish-keyless:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.names.outputs.image }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the Logs host's Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Resolve the package name and the immutable tag
        id: names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/logs-local"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "owner=${owner}" >> "${GITHUB_OUTPUT}"
          echo "tag=${image}:sha-${GITHUB_SHA}-keyless" >> "${GITHUB_OUTPUT}"

      # The build stamp is source data (no secrets): it is copied by the Dockerfile's COPY of apps/logs-local/src,
      # owned by root and read-only for the app user (UID 568) at runtime.
      - name: Write the read-only build stamp
        env:
          TARGET: keyless
        run: node apps/logs-local/scripts/write-build-stamp.mjs

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail closed: proceed only on a positive "not found" from the registry. Present, or any other failure
      # (auth, rate limit, timeout, 5xx, network), stops the run, so an existing tag can never be overwritten.
      - name: Refuse unless the commit tag is proven absent
        timeout-minutes: 3
        shell: bash
        env:
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          set +e
          timeout 60 docker buildx imagetools inspect "${TAG}" >/dev/null 2>inspect-stderr.txt
          code=$?
          set -e
          state="$(node apps/logs-local/scripts/tag-state.mjs "${code}" inspect-stderr.txt "${TAG}" || true)"
          if [[ "${state}" != "absent" ]]; then
            echo "Refusing to publish: the immutable tag is ${state:-unknown} (${TAG})." >&2
            exit 1
          fi

      # Beau approved public code-only images. Observe the package and its repository link read-only with this job's token
      # (no visibility, permission or scope changes). 404 is allowed here only because the package may not exist yet.
      - name: Observe the package visibility before pushing (stop if private, internal or unknown)
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/logs-local/scripts/package-visibility.mjs pre "${{ steps.names.outputs.owner }}" logs-local package-pre.json

      - name: Build and publish the keyless linux/amd64 image (immutable commit tag only)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/logs-local/Dockerfile
          target: keyless
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.names.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Ledge Top Logs local host (keyless)
            app.ledgetop.logs-local.target=keyless
          provenance: mode=max
          sbom: true

      - name: Verify the immutable tag resolves to the built digest
        shell: bash
        env:
          TAG: ${{ steps.names.outputs.tag }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            if docker buildx imagetools inspect "${TAG}" --format '{{json .Manifest}}' > commit-manifest.json; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 2
          done
          resolved="$(node -p 'JSON.parse(require("node:fs").readFileSync("commit-manifest.json", "utf8")).digest')"
          if [[ -z "${EXPECTED_DIGEST}" || "${resolved}" != "${EXPECTED_DIGEST}" ]]; then
            echo "The published tag did not resolve to the build output digest." >&2
            exit 1
          fi

      # Smoke the EXACT digest before any moving tag (bounded, cleaned up; see scripts/smoke-image.sh): the stamp
      # matches this commit and target, the image runs as UID 568, and a first start on an empty data folder writes
      # the blank config and stops not-ready (exit 78).
      # After the push the package must EXIST and be public, linked to this repository, before any receipt or alias.
      - name: Require the public code-only package before any receipt or alias
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/logs-local/scripts/package-visibility.mjs post "${{ steps.names.outputs.owner }}" logs-local package-post.json

      - name: Smoke-test the exact published digest
        id: smoke
        timeout-minutes: 10
        shell: bash
        run: bash apps/logs-local/scripts/smoke-image.sh "${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}" "${GITHUB_SHA}" keyless

      - name: Write the deployment receipt
        id: receipt
        shell: bash
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          receipt="logs-local-keyless-${GITHUB_SHA}.json"
          jq -n --slurpfile pkg package-post.json --arg commit "${GITHUB_SHA}" --arg run "${GITHUB_RUN_ID}" --arg attempt "${GITHUB_RUN_ATTEMPT}" --arg image "${IMAGE}" --arg digest "${DIGEST}" \
            '{schemaVersion:1,target:"keyless",platform:"linux/amd64",commit:$commit,image:$image,digest:$digest,reference:($image+"@"+$digest),candidateTag:($image+":candidate-"+$commit+"-"+$run+"-"+$attempt+"-keyless"),package:{owner:$pkg[0].owner,name:$pkg[0].name,packageType:$pkg[0].packageType,id:$pkg[0].id,visibility:$pkg[0].visibility,repository:$pkg[0].repository,observedAt:$pkg[0].observedAt}}' > "${receipt}"
          echo "path=${receipt}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Logs local host image (keyless)"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Pin in Compose: \`${IMAGE}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the deployment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-local-keyless-${{ github.sha }}
          path: ${{ steps.receipt.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Tag the smoke-tested digest as an immutable keyless candidate (never latest)
        shell: bash
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tag="candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-keyless"
          docker buildx imagetools create --prefer-index=false --tag "${IMAGE}:${tag}" "${IMAGE}@${EXPECTED_DIGEST}"
          docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest}}' > keyless-manifest.json
          node -e 'const m=JSON.parse(require("fs").readFileSync("keyless-manifest.json","utf8")); if (m.digest !== process.env.EXPECTED_DIGEST) throw new Error("keyless candidate tag does not match the smoke-tested digest")'

  publish-full:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.names.outputs.image }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the Logs host's Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Resolve the package name and the immutable tag
        id: names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/logs-local"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "owner=${owner}" >> "${GITHUB_OUTPUT}"
          echo "tag=${image}:sha-${GITHUB_SHA}-full" >> "${GITHUB_OUTPUT}"

      # The build stamp is source data (no secrets): it is copied by the Dockerfile's COPY of apps/logs-local/src,
      # owned by root and read-only for the app user (UID 568) at runtime.
      - name: Write the read-only build stamp
        env:
          TARGET: full
        run: node apps/logs-local/scripts/write-build-stamp.mjs

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail closed: proceed only on a positive "not found" from the registry. Present, or any other failure
      # (auth, rate limit, timeout, 5xx, network), stops the run, so an existing tag can never be overwritten.
      - name: Refuse unless the commit tag is proven absent
        timeout-minutes: 3
        shell: bash
        env:
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          set +e
          timeout 60 docker buildx imagetools inspect "${TAG}" >/dev/null 2>inspect-stderr.txt
          code=$?
          set -e
          state="$(node apps/logs-local/scripts/tag-state.mjs "${code}" inspect-stderr.txt "${TAG}" || true)"
          if [[ "${state}" != "absent" ]]; then
            echo "Refusing to publish: the immutable tag is ${state:-unknown} (${TAG})." >&2
            exit 1
          fi

      # Beau approved public code-only images. Observe the package and its repository link read-only with this job's token
      # (no visibility, permission or scope changes). 404 is allowed here only because the package may not exist yet.
      - name: Observe the package visibility before pushing (stop if private, internal or unknown)
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/logs-local/scripts/package-visibility.mjs pre "${{ steps.names.outputs.owner }}" logs-local package-pre.json

      - name: Build and publish the full linux/amd64 image (immutable commit tag only)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/logs-local/Dockerfile
          target: full
          # Immutable Rust base for the native parser (amd64 manifest digest); the upstream parser revision is pinned
          # in the Dockerfile and its lockfile is checked during the build. Not a secret.
          build-args: |
            RUST_IMAGE=rust@sha256:a044f7ab9a762f95be2ee7eb2c49e4d4a4ec60011210de9f7da01d552cae3a55
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.names.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Ledge Top Logs local host (full: native DJI parser)
            app.ledgetop.logs-local.target=full
            app.ledgetop.logs-local.parser-revision=e2e0775670a8391b4f7ecc40fca4cb01ea4a90fa
          provenance: mode=max
          sbom: true

      - name: Verify the immutable tag resolves to the built digest
        shell: bash
        env:
          TAG: ${{ steps.names.outputs.tag }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            if docker buildx imagetools inspect "${TAG}" --format '{{json .Manifest}}' > commit-manifest.json; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 2
          done
          resolved="$(node -p 'JSON.parse(require("node:fs").readFileSync("commit-manifest.json", "utf8")).digest')"
          if [[ -z "${EXPECTED_DIGEST}" || "${resolved}" != "${EXPECTED_DIGEST}" ]]; then
            echo "The published tag did not resolve to the build output digest." >&2
            exit 1
          fi

      # Smoke the EXACT digest before any moving tag (bounded, cleaned up; see scripts/smoke-image.sh): the stamp
      # matches this commit and target, the image runs as UID 568, and a first start on an empty data folder writes
      # the blank config and stops not-ready (exit 78).
      # After the push the package must EXIST and be public, linked to this repository, before any receipt or alias.
      - name: Require the public code-only package before any receipt or alias
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/logs-local/scripts/package-visibility.mjs post "${{ steps.names.outputs.owner }}" logs-local package-post.json

      - name: Smoke-test the exact published digest
        id: smoke
        timeout-minutes: 10
        shell: bash
        run: bash apps/logs-local/scripts/smoke-image.sh "${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}" "${GITHUB_SHA}" full

      - name: Write the deployment receipt
        id: receipt
        shell: bash
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PARSER_SHA256: ${{ steps.smoke.outputs.parser_sha256 }}
        run: |
          receipt="logs-local-full-${GITHUB_SHA}.json"
          # The parser hash comes from the bounded smoke of this exact digest; refuse without it.
          parser="${PARSER_SHA256}"
          [[ "${parser}" =~ ^[0-9a-f]{64}$ ]] || { echo "the smoke did not report the parser SHA-256" >&2; exit 1; }
          jq -n --slurpfile pkg package-post.json --arg commit "${GITHUB_SHA}" --arg run "${GITHUB_RUN_ID}" --arg attempt "${GITHUB_RUN_ATTEMPT}" --arg image "${IMAGE}" --arg digest "${DIGEST}" --arg parser "${parser}" \
            '{schemaVersion:1,target:"full",parserRevision:"e2e0775670a8391b4f7ecc40fca4cb01ea4a90fa",rustImage:"rust@sha256:a044f7ab9a762f95be2ee7eb2c49e4d4a4ec60011210de9f7da01d552cae3a55",parserSha256:$parser,platform:"linux/amd64",commit:$commit,image:$image,digest:$digest,reference:($image+"@"+$digest),candidateTag:($image+":candidate-"+$commit+"-"+$run+"-"+$attempt+"-full"),package:{owner:$pkg[0].owner,name:$pkg[0].name,packageType:$pkg[0].packageType,id:$pkg[0].id,visibility:$pkg[0].visibility,repository:$pkg[0].repository,observedAt:$pkg[0].observedAt}}' > "${receipt}"
          echo "path=${receipt}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Logs local host image (full: native DJI parser; real decoding not proven by CI)"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Pin in Compose: \`${IMAGE}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the deployment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-local-full-${{ github.sha }}
          path: ${{ steps.receipt.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Tag the smoke-tested digest as an immutable full candidate (never latest)
        shell: bash
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tag="candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-full"
          docker buildx imagetools create --prefer-index=false --tag "${IMAGE}:${tag}" "${IMAGE}@${EXPECTED_DIGEST}"
          docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest}}' > full-manifest.json
          node -e 'const m=JSON.parse(require("fs").readFileSync("full-manifest.json","utf8")); if (m.digest !== process.env.EXPECTED_DIGEST) throw new Error("full candidate tag does not match the smoke-tested digest")'
          echo "- Full candidate: commit \`${GITHUB_SHA}\`, digest \`${EXPECTED_DIGEST}\` (the promote-latest job moves latest to it)" >> "${GITHUB_STEP_SUMMARY}"

  promote-latest:
    # Moves latest to the build verified above. It shares the writer concurrency group for this tag with the hand-run
    # promote-logs-local.yml, so automatic and manual writes never interleave; no environment, so it never waits for approval.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: publish-full
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: latest-writer-logs-local
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Authenticate to GHCR to move latest
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest to this verified main build (never to an older commit)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_WORKFLOW: promote-logs-local.yml
          IMAGE_NAME: ${{ needs.publish-full.outputs.image }}
          IMMUTABLE_TAG: ${{ needs.publish-full.outputs.image }}:sha-${{ github.sha }}-full
          PROMOTE_DIGEST: ${{ needs.publish-full.outputs.digest }}
        run: |
          set -euo pipefail
          # Like Project-Alpha, a main push moves latest in the same run that built the image, but only here: after the
          # publishing job (every verify and test step) passed, to its exact digest, and never back to an older main
          # commit. This job and the hand-run promote workflow share one writer concurrency group for this tag, so the
          # reads, compare, write and read-back below never interleave with another writer of it.
          fail() { echo "::error::$1 latest was not changed."; exit 1; }
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' | tr -d '"'; }
          revision_of() { docker buildx imagetools inspect "$1" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}'; }
          # Prints latest's digest, or "absent" only for the registry's exact one-line answer for this missing tag.
          # Any other failure (auth, network, rate limit, server error, other wording) returns non-zero.
          read_latest() {
            local ref="$IMAGE_NAME:latest" out line
            if out="$(digest_of "$ref" 2>"$RUNNER_TEMP/latest-error.txt")"; then printf '%s' "$out"; return 0; fi
            line="$(tr -d '\r' < "$RUNNER_TEMP/latest-error.txt" | grep . || true)"
            if [[ "$line" == "ERROR: $ref: not found" || "$line" == "ERROR: $ref: MANIFEST_UNKNOWN: manifest unknown" \
              || "$line" == "ERROR: $ref: MANIFEST_UNKNOWN: manifest unknown; map[Tag:latest]" ]]; then
              printf absent; return 0
            fi
            cat "$RUNNER_TEMP/latest-error.txt" >&2
            return 1
          }
          COMMIT="$GITHUB_SHA"
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] || fail "Only a push to main moves latest."
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$PROMOTE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "No verified commit and digest."
          [[ "$IMMUTABLE_TAG" == "$IMAGE_NAME:sha-$COMMIT" || "$IMMUTABLE_TAG" == "$IMAGE_NAME:sha-$COMMIT-full" ]] || fail "Unexpected immutable tag $IMMUTABLE_TAG."
          [[ "$MANUAL_WORKFLOW" =~ ^promote-[a-z-]+\.yml$ ]] || fail "Unexpected manual promotion workflow $MANUAL_WORKFLOW."
          [[ "$(digest_of "$IMMUTABLE_TAG")" == "$PROMOTE_DIGEST" ]] || fail "$IMMUTABLE_TAG does not name the verified $PROMOTE_DIGEST."
          [[ "$(revision_of "$IMAGE_NAME@$PROMOTE_DIGEST")" == "$COMMIT" ]] || fail "The verified digest does not carry commit $COMMIT."
          # A manual promotion (rollback or re-promotion) that succeeded after this run was created wins over this build:
          # it holds until the next merge to main, whose own run is created after it.
          CREATED="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)" || fail "Cannot read when this run was created."
          [[ "$CREATED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || fail "Unexpected run creation time $CREATED."
          MANUAL="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$MANUAL_WORKFLOW/runs?status=success&per_page=100&created=%3E%3D$CREATED" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')" || fail "Cannot list manual promotions."
          [[ "$MANUAL" =~ ^[0-9]+$ ]] || fail "Unexpected manual promotion count $MANUAL."
          PREVIOUS_DIGEST="$(read_latest)" || fail "Cannot read the current latest."
          PREVIOUS_COMMIT=none
          if [[ "$MANUAL" != 0 ]]; then
            DECISION=kept-manual
          elif [[ "$PREVIOUS_DIGEST" == "$PROMOTE_DIGEST" ]]; then
            DECISION=already-latest
          elif [[ "$PREVIOUS_DIGEST" == absent ]]; then
            DECISION=create
          else
            [[ "$PREVIOUS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "The current latest digest is malformed: $PREVIOUS_DIGEST."
            PREVIOUS_COMMIT="$(revision_of "$IMAGE_NAME@$PREVIOUS_DIGEST")" || fail "Cannot read the commit of the current latest."
            [[ "$PREVIOUS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "The current latest carries no commit label; promote it once by hand."
            # ahead: this commit descends from the one latest names now. behind: latest is already newer on main.
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$PREVIOUS_COMMIT...$COMMIT" --jq .status)" || fail "Cannot compare $PREVIOUS_COMMIT with $COMMIT."
            case "$STATUS" in
              ahead) DECISION=promote ;;
              behind) DECISION=kept-newer ;;
              *) fail "latest names $PREVIOUS_COMMIT, which is not an older main commit than $COMMIT ($STATUS)." ;;
            esac
          fi
          {
            echo "### Automatic promotion of \`$IMAGE_NAME:latest\`"
            echo "- Commit: \`$COMMIT\`"
            echo "- Digest: \`$PROMOTE_DIGEST\`"
            echo "- Previous latest: \`$PREVIOUS_DIGEST\` (commit \`$PREVIOUS_COMMIT\`)"
            echo "- Decision: $DECISION"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$DECISION" in
            kept-manual) echo "::warning::A manual promotion of latest succeeded after this build started; it holds until the next merge to main."; exit 0 ;;
            kept-newer) echo "::warning::latest already names $PREVIOUS_COMMIT, which is newer on main than $COMMIT; latest is never moved back automatically."; exit 0 ;;
            already-latest) exit 0 ;;
          esac
          NOW="$(read_latest)" || fail "Cannot re-read latest before the write."
          [[ "$NOW" == "$PREVIOUS_DIGEST" ]] || fail "latest changed while this step ran (was $PREVIOUS_DIGEST, now $NOW)."
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:latest" "$IMAGE_NAME@$PROMOTE_DIGEST"
          if [[ "$(digest_of "$IMAGE_NAME:latest")" != "$PROMOTE_DIGEST" ]]; then
            echo "::error::latest could not be confirmed as $PROMOTE_DIGEST. Roll back with the manual promote workflow (previous: $PREVIOUS_DIGEST, commit $PREVIOUS_COMMIT)."
            exit 1
          fi
          echo "- Result: latest now names \`$PROMOTE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
