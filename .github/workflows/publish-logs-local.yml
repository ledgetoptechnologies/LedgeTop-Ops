name: Publish Logs local host image (keyless)

# Main only. No manual, pull-request, tag or other-branch triggers: every published image is exactly a main commit.
# Publishes ONLY the keyless target (no native DJI parser). The full target is deliberately absent until the pinned
# Rust base and the native parser are accepted; adding it is a separate, reviewed change.
on:
  push:
    branches: [main]
    paths:
      - apps/logs-local/**
      - apps/logs/src/worker/**
      - apps/logs/src/odl/map.mjs
      - apps/logs/src/odl/util.mjs
      - apps/logs/src/odl/contract.mjs
      - apps/logs/migrations/**
      - apps/logs-decoder/src/**
      - .github/workflows/publish-logs-local.yml

concurrency:
  group: publish-logs-local-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the Logs host's Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Logs local host tests
        run: npm --prefix apps/logs-local test

  publish-keyless:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.names.outputs.image }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the Logs host's Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Resolve the package name and the immutable tag
        id: names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/logs-local"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${image}:sha-${GITHUB_SHA}-keyless" >> "${GITHUB_OUTPUT}"

      # The build stamp is source data (no secrets): it is copied by the Dockerfile's COPY of apps/logs-local/src,
      # owned by root and read-only for the app user (UID 568) at runtime.
      - name: Write the read-only build stamp
        env:
          TARGET: keyless
        run: node apps/logs-local/scripts/write-build-stamp.mjs

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing commit tag
        shell: bash
        run: |
          if docker buildx imagetools inspect "${{ steps.names.outputs.tag }}" >/dev/null 2>&1; then
            echo "The immutable commit tag already exists: ${{ steps.names.outputs.tag }}" >&2
            exit 1
          fi

      - name: Build and publish the keyless linux/amd64 image (immutable commit tag only)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/logs-local/Dockerfile
          target: keyless
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.names.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Ledge Top Logs local host (keyless)
            app.ledgetop.logs-local.target=keyless
          provenance: mode=max
          sbom: true

      - name: Verify the immutable tag resolves to the built digest
        shell: bash
        env:
          TAG: ${{ steps.names.outputs.tag }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            if docker buildx imagetools inspect "${TAG}" --format '{{json .Manifest}}' > commit-manifest.json; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 2
          done
          resolved="$(node -p 'JSON.parse(require("node:fs").readFileSync("commit-manifest.json", "utf8")).digest')"
          if [[ -z "${EXPECTED_DIGEST}" || "${resolved}" != "${EXPECTED_DIGEST}" ]]; then
            echo "The published tag did not resolve to the build output digest." >&2
            exit 1
          fi

      # Smoke the EXACT digest before any moving tag: the stamp matches this commit and target, the image runs as
      # UID 568, and a first start on an empty data folder writes the blank config and stops not-ready (exit 78).
      - name: Smoke-test the exact published digest
        shell: bash
        env:
          REF: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "${REF}"
          docker run --rm --network none --entrypoint node "${REF}" apps/logs-local/src/build-stamp.mjs check "${GITHUB_SHA}" keyless
          test "$(docker run --rm --network none --entrypoint id "${REF}" -u)" = "568"
          data="$(mktemp -d)"; sudo chown 568:568 "${data}"
          set +e
          docker run --rm --network none --read-only --tmpfs /tmp:size=8m -v "${data}:/data" "${REF}"
          code=$?
          set -e
          test "${code}" = "78"
          sudo test -f "${data}/flight-logs/config/logs.env"
          test "$(sudo stat -c '%a' "${data}/flight-logs/config/logs.env")" = "600"

      - name: Promote the smoke-tested digest to the keyless tag (never latest or full)
        shell: bash
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false --tag "${IMAGE}:keyless" "${IMAGE}@${EXPECTED_DIGEST}"
          docker buildx imagetools inspect "${IMAGE}:keyless" --format '{{json .Manifest}}' > keyless-manifest.json
          node -e 'const m=JSON.parse(require("fs").readFileSync("keyless-manifest.json","utf8")); if (m.digest !== process.env.EXPECTED_DIGEST) throw new Error("keyless tag does not match the smoke-tested digest")'

      - name: Write the deployment receipt
        id: receipt
        shell: bash
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          receipt="logs-local-keyless-${GITHUB_SHA}.json"
          jq -n --arg commit "${GITHUB_SHA}" --arg image "${IMAGE}" --arg digest "${DIGEST}" \
            '{schemaVersion:1,target:"keyless",platform:"linux/amd64",commit:$commit,image:$image,digest:$digest,reference:($image+"@"+$digest),movingTag:($image+":keyless")}' > "${receipt}"
          echo "path=${receipt}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Logs local host image (keyless)"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Pin in Compose: \`${IMAGE}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the deployment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-local-keyless-${{ github.sha }}
          path: ${{ steps.receipt.outputs.path }}
          if-no-files-found: error
          retention-days: 30
