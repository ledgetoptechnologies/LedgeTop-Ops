name: Promote Operations Viewer candidate to latest

# Manual, main-only promotion. publish-viewer.yml builds and verifies every
# qualifying merge to main and publishes only immutable tags
# (`candidate-<commit>-<run>-<attempt>` and `sha-<commit>`). This workflow moves
# `latest` to one of those verified digests, and nothing else moves it. It does
# not rebuild or deploy anything. Rollback is a promotion of an older candidate.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character main commit SHA of the verified candidate
        required: true
        type: string
      digest:
        description: The candidate's image digest (sha256:...), as shown in its publish run summary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-viewer-latest
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/ledgetoptechnologies/ledgetop-ops-viewer
      PROMOTE_COMMIT: ${{ inputs.commit }}
      PROMOTE_DIGEST: ${{ inputs.digest }}
    steps:
      - name: Validate requested candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROMOTE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::commit must be a full lowercase 40-character SHA'; exit 1; }
          [[ "$PROMOTE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::digest must be sha256:<64 hex>'; exit 1; }

      - name: Check out promotion verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/viewer/scripts/verify-promotion-attestation.mjs
          sparse-checkout-cone-mode: false

      - name: Require the commit to be on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$PROMOTE_COMMIT...$GITHUB_SHA" --jq .status)"
          [[ "$STATUS" == ahead || "$STATUS" == identical ]] || { echo "::error::$PROMOTE_COMMIT is not part of main ($STATUS)"; exit 1; }

      - name: Find the successful main publish run for the commit
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/publish-viewer.yml/runs" \
            -f head_sha="$PROMOTE_COMMIT" -f branch=main -f event=push -f status=success -f per_page=20 \
            --jq "[.workflow_runs[] | select(.head_sha == \"$PROMOTE_COMMIT\" and .head_branch == \"main\" and .event == \"push\" and .conclusion == \"success\" and .path == \".github/workflows/publish-viewer.yml\" and .head_repository.full_name == \"$GITHUB_REPOSITORY\")] | first | .id // empty")"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::no successful main publish run for $PROMOTE_COMMIT; it is not a verified candidate"; exit 1; }
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Verify the candidate's release attestation
        id: attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/candidate-attestation"
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "viewer-image-attestation-$PROMOTE_COMMIT" --dir "$DIR"
          (cd "$DIR" && sha256sum --check --strict viewer-image-attestation.json.sha256)
          node apps/viewer/scripts/verify-promotion-attestation.mjs "$DIR/viewer-image-attestation.json" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify the registry still holds the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          SHA_DIGEST="$(docker buildx imagetools inspect "$IMAGE_NAME:sha-$PROMOTE_COMMIT" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "$SHA_DIGEST" = "$PROMOTE_DIGEST" || { echo "::error::sha-$PROMOTE_COMMIT names $SHA_DIGEST, not $PROMOTE_DIGEST"; exit 1; }
          VERIFY_IMAGE="$IMAGE_NAME@$PROMOTE_DIGEST"
          docker pull "$VERIFY_IMAGE"
          test "$(docker inspect --format '{{.Config.User}}' "$VERIFY_IMAGE")" = "568:568"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$VERIFY_IMAGE")" = "$PROMOTE_COMMIT"

      - name: Read current latest and resolve the rollback target
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          # Only a genuine "not found / manifest unknown" means latest is absent. Any
          # other registry, network or permission error is retried, then aborts
          # before anything is written.
          inspect_digest() {
            local ref="$1" attempt out
            for attempt in 1 2 3; do
              if out="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' 2>"$RUNNER_TEMP/inspect-error.txt")"; then
                printf '%s' "$out" | tr -d '"'
                return 0
              fi
              if ! grep -qiE 'denied|unauthori[sz]ed|forbidden|toomanyrequests|timeout|refused|\b(401|403|429|5[0-9][0-9])\b' "$RUNNER_TEMP/inspect-error.txt" \
                && grep -qiE '(^|[[:space:]:])(not found|manifest unknown)' "$RUNNER_TEMP/inspect-error.txt"; then
                printf 'absent'
                return 0
              fi
              echo "registry inspect of $ref failed (attempt $attempt):" >&2
              cat "$RUNNER_TEMP/inspect-error.txt" >&2
              [[ "$attempt" == 3 ]] || sleep "${PROMOTE_RETRY_DELAY_SECONDS:-5}"
            done
            return 1
          }
          PREVIOUS_DIGEST="$(inspect_digest "$IMAGE_NAME:latest")" || { echo '::error::cannot read the current latest; nothing was changed'; exit 1; }
          if [[ "$PREVIOUS_DIGEST" != absent ]]; then
            [[ "$PREVIOUS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::current latest digest is malformed: $PREVIOUS_DIGEST; nothing was changed"; exit 1; }
            RESOLVED="$(inspect_digest "$IMAGE_NAME@$PREVIOUS_DIGEST")" || { echo '::error::cannot resolve the current latest digest; nothing was changed'; exit 1; }
            test "$RESOLVED" = "$PREVIOUS_DIGEST" || { echo "::error::current latest digest $PREVIOUS_DIGEST does not resolve; nothing was changed"; exit 1; }
          fi
          echo "digest=$PREVIOUS_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Persist the rollback receipt before moving latest
        id: receipt
        shell: bash
        env:
          PREVIOUS_DIGEST: ${{ steps.previous.outputs.digest }}
          CANDIDATE_RUN_ID: ${{ steps.run.outputs.id }}
          VIEWER_SCHEMA_VERSION: ${{ steps.attestation.outputs.schema-version }}
        run: |
          set -euo pipefail
          [[ "$PREVIOUS_DIGEST" == absent || "$PREVIOUS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          DIR="$RUNNER_TEMP/viewer-promotion-receipt"
          mkdir -p "$DIR"
          printf '{\n  "receiptSchemaVersion": 1,\n  "image": "%s",\n  "previousDigest": "%s",\n  "newDigest": "%s",\n  "commit": "%s",\n  "candidateRunId": "%s",\n  "promotionRunId": "%s",\n  "promotionRunAttempt": "%s",\n  "viewerSchemaVersion": "%s",\n  "recordedAt": "%s"\n}\n' \
            "$IMAGE_NAME" "$PREVIOUS_DIGEST" "$PROMOTE_DIGEST" "$PROMOTE_COMMIT" "$CANDIDATE_RUN_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$VIEWER_SCHEMA_VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$DIR/viewer-promotion-receipt.json"
          {
            printf 'Rollback receipt (recorded before `latest` is changed)\n\n'
            printf -- '- Previous latest (rollback target): `%s`\n- New digest: `%s`\n- Commit: `%s`\n' "$PREVIOUS_DIGEST" "$PROMOTE_DIGEST" "$PROMOTE_COMMIT"
            printf -- '- Candidate publish run: %s/%s/actions/runs/%s\n- Viewer schema: %s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$CANDIDATE_RUN_ID" "$VIEWER_SCHEMA_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rollback receipt
        uses: actions/upload-artifact@v6
        with:
          name: viewer-promotion-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/viewer-promotion-receipt/viewer-promotion-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Move latest to the verified digest
        id: move
        shell: bash
        env:
          PREVIOUS_DIGEST: ${{ steps.previous.outputs.digest }}
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/viewer-promotion-result/viewer-promotion-result.json"
          mkdir -p "$(dirname "$RESULT")"
          record() { printf '{"status": "%s", "previousDigest": "%s", "newDigest": "%s", "commit": "%s", "latestAfter": "%s"}\n' "$1" "$PREVIOUS_DIGEST" "$PROMOTE_DIGEST" "$PROMOTE_COMMIT" "$2" > "$RESULT"; }
          rollback_help() {
            if [[ "$PREVIOUS_DIGEST" == absent ]]; then
              echo "No latest existed before this promotion; delete or repoint latest by hand if needed."
            else
              echo "Rollback: run this workflow with the earlier candidate's commit and digest $PREVIOUS_DIGEST, or (package admin):"
              echo "  docker buildx imagetools create --tag $IMAGE_NAME:latest $IMAGE_NAME@$PREVIOUS_DIGEST"
            fi
          }
          record started unknown
          if [[ "$PREVIOUS_DIGEST" != "$PROMOTE_DIGEST" ]]; then
            docker buildx imagetools create --tag "$IMAGE_NAME:latest" "$IMAGE_NAME@$PROMOTE_DIGEST" || {
              record write-failed unknown; echo '::error::moving latest failed; its state is unknown'; rollback_help; exit 1; }
          fi
          PROMOTED_DIGEST=unreadable
          for attempt in 1 2 3; do
            if PROMOTED_DIGEST="$(docker buildx imagetools inspect "$IMAGE_NAME:latest" --format '{{json .Manifest.Digest}}')"; then
              PROMOTED_DIGEST="$(printf '%s' "$PROMOTED_DIGEST" | tr -d '"')"
              break
            fi
            PROMOTED_DIGEST=unreadable
            [[ "$attempt" == 3 ]] || sleep "${PROMOTE_RETRY_DELAY_SECONDS:-5}"
          done
          if [[ "$PROMOTED_DIGEST" != "$PROMOTE_DIGEST" ]]; then
            record verify-failed "$PROMOTED_DIGEST"
            echo "::error::latest could not be confirmed as $PROMOTE_DIGEST (read: $PROMOTED_DIGEST)"
            rollback_help
            exit 1
          fi
          record promoted "$PROMOTED_DIGEST"
          printf 'Promoted `%s:latest` to `%s` (previous `%s`)\n' "$IMAGE_NAME" "$PROMOTE_DIGEST" "$PREVIOUS_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the promotion result
        if: ${{ always() && steps.receipt.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: viewer-promotion-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/viewer-promotion-result/viewer-promotion-result.json
          if-no-files-found: warn
          retention-days: 90
