name: Publish Operations Viewer image

on:
  push:
    branches: [main]
    paths:
      - 'apps/viewer/**'
      - '.github/workflows/publish-viewer.yml'
      - 'scripts/viewer-monorepo-boundaries.test.mjs'

permissions:
  contents: read
  packages: write

# A main build publishes immutable candidate and sha tags, and only after every
# verify step has passed does the promote-latest job move `latest` to that exact
# digest, never back to an older main commit. The manually dispatched, approved
# promote-viewer.yml stays the rollback and re-promotion path. Builds are never
# cancelled mid-run, so a tag step cannot be interrupted; a newer merge queued
# behind a running build replaces any older queued build.
concurrency:
  group: publish-viewer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    # Drafts and branches other than main are tested on staging, not on GitHub minutes.
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    defaults:
      run:
        working-directory: apps/viewer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Verify monorepo publication boundaries
        run: node --test ../../scripts/viewer-monorepo-boundaries.test.mjs

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/ledgetoptechnologies/ledgetop-ops-viewer" >> "$GITHUB_OUTPUT"

      - name: Set isolated candidate reference
        id: candidate
        shell: bash
        run: echo "ref=${{ steps.image.outputs.name }}:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # metadata-action's automatic semver flavor otherwise emits
          # `latest` for version tags even when the explicit raw tag is off.
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=tag

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Require ImageSharp build license
        shell: bash
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          set -euo pipefail
          test -n "$SIXLABORS_LICENSE" || { echo '::error::SIXLABORS_LICENSE is required for the ImageSharp 3.2.0 build'; exit 1; }

      - name: Build isolated candidate
        id: build
        uses: docker/build-push-action@v7
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        with:
          context: apps/viewer
          file: apps/viewer/Dockerfile
          platforms: linux/amd64
          secret-envs: |
            sixlabors-license=SIXLABORS_LICENSE
          build-args: |
            VIEWER_SOURCE_COMMIT=${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          tags: ${{ steps.candidate.outputs.ref }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=viewer
          cache-to: type=gha,scope=viewer,mode=max,ignore-error=true
          # Docker's local image store cannot retain attestation manifests. Push
          # candidates keep full provenance/SBOM; PR candidates are loaded only
          # for the identical runtime verification below.
          provenance: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          sbom: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Verify exact candidate image
        id: verify
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.ref }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_SCHEMA_VERSION: "87"
          EXPECTED_OBJ2TILES_VERSION: "1.6.2"
          EXPECTED_OBJ2TILES_SOURCE_SHA256: "79093e12f6eab2cfcd522aebe670892c5d8874e160956b84f3e55c77b94ac0b5"
          EXPECTED_OBJ2TILES_PATCH_SHA256: "fb35e1f99e76d6af99748681b65e08c3e0072da23cb7d61098c4bea1e45e604c"
          EXPECTED_OBJ2TILES_LOCKSET_SHA256: "b30f6a37f1d3cc542ea10a484672750d93af70d76b57257dce2ff47abab64d98"
          EXPECTED_OBJ2TILES_LICENSE_NOTICE_SHA256: "86768eb4bb03feacad31ba6ec90c003abafdebeb5257a1c3eeb1b4f348530a4e"
          EXPECTED_POTREE_VERSION: "1.8.2"
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            CANDIDATE_DIGEST="$(docker buildx imagetools inspect "$CANDIDATE_IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            test "$CANDIDATE_DIGEST" = "$IMAGE_DIGEST"
            VERIFY_IMAGE="$IMAGE_NAME@$IMAGE_DIGEST"
            docker pull "$VERIFY_IMAGE"
          else
            VERIFY_IMAGE="$CANDIDATE_IMAGE"
            docker image inspect "$VERIFY_IMAGE" >/dev/null
          fi
          test "$(docker inspect --format '{{.Config.User}}' "$VERIFY_IMAGE")" = "568:568"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$VERIFY_IMAGE")" = "$EXPECTED_REVISION"
          docker run --rm --entrypoint sh -e EXPECTED_REVISION="$EXPECTED_REVISION" "$VERIFY_IMAGE" -c \
            'test "$(cat /app/source-commit.txt)" = "$EXPECTED_REVISION" && test "$(stat -c %a /app/source-commit.txt)" = 444'
            docker run --rm --entrypoint sh -e EXPECTED_OBJ2TILES_VERSION="$EXPECTED_OBJ2TILES_VERSION" "$VERIFY_IMAGE" -c \
              '/opt/obj2tiles/Obj2Tiles --version 2>&1 | grep -F "$EXPECTED_OBJ2TILES_VERSION" >/dev/null'
            docker run --rm --network none --entrypoint node "$VERIFY_IMAGE" -e '
              const assert=require("node:assert/strict"),fs=require("node:fs"),child=require("node:child_process");
              const receipt=JSON.parse(fs.readFileSync("/opt/poisson/build-info.json","utf8"));
              assert.equal(receipt.sourceCommit,"262b0f539d404057d1f36e1adc07fc9388678899");
              assert.equal(receipt.sourceSha256,"4a07ad091a63cc8403c57a8906b97b41d07c2fd87aa8aad0e7680dac20c4dcd5");
              assert.equal(receipt.patchSha256,"9ecff362ba0dba772d1969b415768ecc5503aba3f2dc5e18d2d101834ba9272c");
              assert.equal(receipt.precision,"double");assert.equal(receipt.threads,2);
              assert.equal(require("./server/measurementReconstructionSupport").reconstructionAvailable(),true);
              assert.equal(require("./server/measurementReconstructionSupport").reconstructionAvailable({measurementPoissonBin:"/unavailable"}),false);
              const smoke=child.spawnSync("/opt/poisson/PoissonRecon",[],{encoding:"utf8",timeout:10000});
              assert.ok(!smoke.error);assert.match(smoke.stdout+smoke.stderr,/Usage:/);
            '
            # Only tests are mounted; all numerical engines, private APIs and
            # native libraries are exercised from the exact built runtime.
            docker run --rm --network none --entrypoint node \
              -e POTREE_BUNDLE=/app/dist/potree/build/potree/potree.js \
              -v "$PWD/test:/app/test:ro" "$VERIFY_IMAGE" --test \
              test/potree-visibility-patch.test.mjs \
              test/measurement-volume.test.mjs \
            test/measurement-native-raster.test.mjs \
            test/measurement-worker-transport.test.js \
            test/measurement-unit-evidence.test.mjs \
            test/measurement-delaunay-reference.test.mjs \
            test/measurement-delaunay-frozen-review.test.mjs \
              test/measurement-raster-transect.test.mjs \
              test/measurement-point-surface.test.mjs \
              test/measurement-ept-crs.test.mjs \
              test/measurement-ept-vertical-units.test.mjs \
              test/measurement-point-encoded-units.test.mjs \
              test/measurement-point-transect-request.test.js \
              test/ephemeral-point-measurements.test.js \
              test/measurement-closed-mesh.test.mjs \
              test/measurement-reconstruction.test.mjs \
              test/measurement-calculation-jobs.test.js \
              test/measurement-transect-jobs.test.js \
              test/measurement-private-api.test.js
          docker run --rm --entrypoint node \
            -e EXPECTED_OBJ2TILES_SOURCE_SHA256="$EXPECTED_OBJ2TILES_SOURCE_SHA256" \
            -e EXPECTED_OBJ2TILES_PATCH_SHA256="$EXPECTED_OBJ2TILES_PATCH_SHA256" \
            -e EXPECTED_OBJ2TILES_LOCKSET_SHA256="$EXPECTED_OBJ2TILES_LOCKSET_SHA256" \
            -e EXPECTED_OBJ2TILES_LICENSE_NOTICE_SHA256="$EXPECTED_OBJ2TILES_LICENSE_NOTICE_SHA256" \
            "$VERIFY_IMAGE" -e '
              const crypto=require("node:crypto"),fs=require("node:fs");
              const info=JSON.parse(fs.readFileSync("/opt/obj2tiles/build-info.json","utf8"));
              const binary=crypto.createHash("sha256").update(fs.readFileSync("/opt/obj2tiles/Obj2Tiles")).digest("hex");
              if(info.schemaVersion!==2||info.sourceVersion!=="v1.6.2"||info.sourceSha256!==process.env.EXPECTED_OBJ2TILES_SOURCE_SHA256||info.patchSha256!==process.env.EXPECTED_OBJ2TILES_PATCH_SHA256||info.imageSharpVersion!=="3.2.0"||info.lockSetSha256!==process.env.EXPECTED_OBJ2TILES_LOCKSET_SHA256||info.licenseNoticeSha256!==process.env.EXPECTED_OBJ2TILES_LICENSE_NOTICE_SHA256||info.binarySha256!==binary)process.exit(1);
              const license="/opt/obj2tiles/licenses/imagesharp-3.2.0/";
              if(crypto.createHash("sha256").update(fs.readFileSync(license+"manifest.json")).digest("hex")!==info.licenseNoticeSha256)process.exit(2);
              const manifest=JSON.parse(fs.readFileSync(license+"manifest.json","utf8"));
              for(const item of manifest.files){const actual=crypto.createHash("sha256").update(fs.readFileSync(license+item.path)).digest("hex");if(actual!==item.sha256)process.exit(3);}
            '
          docker run --rm "$VERIFY_IMAGE" node scripts/verify-obj2tiles-runtime.mjs
          docker run --rm --network none "$VERIFY_IMAGE" node scripts/verify-potree-visibility.mjs /app/dist/potree/build/potree/potree.js
          docker run --rm --entrypoint node "$VERIFY_IMAGE" -e '
            const fs=require("node:fs");
            const file="/app/dist/potree/build/potree/potree.js";
            const source=fs.readFileSync(file,"utf8");
            const start=source.indexOf("class EptLoader");
            const end=source.indexOf("class CopcLoader",start+1);
            const shared="new Potree.PointCloudCopcGeometryNode(geometry)";
            const nonexistent="new Potree.PointCloudEptGeometryNode(geometry)";
            if(start<0||end<=start)process.exit(2);
            const block=source.slice(start,end);
            if((block.split(shared).length-1)!==1||source.includes(nonexistent)||!source.slice(end).includes(shared))process.exit(3);
            const route=source.indexOf("isFullFile ?");
            const lazRs=source.indexOf("EptLazRsDecoderWorker.js",route);
            const legacy=source.indexOf("EptLaszipDecoderWorker.js",route);
            const moduleFactory="url.endsWith(\"/EptLazRsDecoderWorker.js\") ? {type: \"module\"} : undefined";
            const decodedPointCount="Number.isSafeInteger(e.data.pointCount) && e.data.pointCount > 0 ? e.data.pointCount : pointCount";
            if(route<0||lazRs<route||legacy<lazRs||!source.includes(moduleFactory)||!source.includes(decodedPointCount))process.exit(4);
            const workerDirectory="/app/dist/potree/build/potree/workers";
            const workerFile=`${workerDirectory}/EptLazRsDecoderWorker.js`;
            const workerSource=fs.readFileSync(workerFile,"utf8");
            const relativeWasmReference=/new URL\(`laz_rs_wasm_bg-[^`]+\.wasm`,import\.meta\.url\)/.test(workerSource);
            if(!workerSource.includes("EPT LAZ-RS decode failed")||workerSource.includes("data:application/wasm;base64,")||workerSource.length<10000||!relativeWasmReference)process.exit(5);
            const wasm=fs.readdirSync(workerDirectory).filter((name)=>/^laz_rs_wasm_bg-.*\.wasm$/.test(name));
            if(wasm.length!==1||fs.statSync(`${workerDirectory}/${wasm[0]}`).size<1000)process.exit(6);
          '
          VIEWER_SCHEMA_VERSION="$(docker run --rm --entrypoint node "$VERIFY_IMAGE" -e '
            const {openDatabase}=require("./server/database");
            const db=openDatabase("/tmp/release-attestation.sqlite");
            try{process.stdout.write(String(db.prepare("SELECT MAX(version) AS version FROM schema_migrations").get().version));}
            finally{db.close();}
          ')"
          test "$VIEWER_SCHEMA_VERSION" = "$EXPECTED_SCHEMA_VERSION"
          echo "schema-version=$VIEWER_SCHEMA_VERSION" >> "$GITHUB_OUTPUT"
          printf 'Verified candidate image `%s`\n' "$VERIFY_IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify converter integration in exact candidate image
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          VERIFY_IMAGE="$IMAGE_NAME@$IMAGE_DIGEST"
          docker image inspect "$VERIFY_IMAGE" >/dev/null
          test "$(docker inspect --format '{{.Config.User}}' "$VERIFY_IMAGE")" = "568:568"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$VERIFY_IMAGE")" = "$EXPECTED_REVISION"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount "type=bind,source=$GITHUB_WORKSPACE/apps/viewer/test/image,target=/app/test/image,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/apps/viewer/test/helpers,target=/app/test/helpers,readonly" \
            --entrypoint node "$VERIFY_IMAGE" --test --test-concurrency=1 /app/test/image/v2-mesh-synthetic.test.mjs

      - name: Publish immutable sha tag for verified digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          FINAL_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          PUBLISHED_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          # This step never moves `latest`; only the one write-once sha tag is published here.
          tag="$IMAGE_NAME:sha-$EXPECTED_REVISION"
          test "$FINAL_TAGS" = "$tag"
          if EXISTING_DIGEST="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' 2>inspect-error.txt)"; then
            EXISTING_DIGEST="$(printf '%s' "$EXISTING_DIGEST" | tr -d '"')"
            test "$EXISTING_DIGEST" = "$IMAGE_DIGEST" || { echo "::error::$tag already names $EXISTING_DIGEST; immutable sha tags are never moved"; exit 1; }
          else
            grep -qi 'not found' inspect-error.txt || { cat inspect-error.txt >&2; exit 1; }
            docker buildx imagetools create --tag "$tag" "$PUBLISHED_IMAGE"
          fi
          rm -f inspect-error.txt
          PROMOTED_DIGEST="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "$PROMOTED_DIGEST" = "$IMAGE_DIGEST"
          printf 'Candidate for promotion: commit `%s`, digest `%s` (tag `%s`). `latest` moves to it in the promote-latest job once this job has passed.\n\n' "$EXPECTED_REVISION" "$IMAGE_DIGEST" "$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Write verified release attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_SCHEMA_VERSION: "87"
          EXPECTED_OBJ2TILES_VERSION: "1.6.2"
          EXPECTED_OBJ2TILES_LOCKSET_SHA256: "b30f6a37f1d3cc542ea10a484672750d93af70d76b57257dce2ff47abab64d98"
          EXPECTED_OBJ2TILES_LICENSE_NOTICE_SHA256: "86768eb4bb03feacad31ba6ec90c003abafdebeb5257a1c3eeb1b4f348530a4e"
          EXPECTED_POTREE_VERSION: "1.8.2"
          VIEWER_SCHEMA_VERSION: ${{ steps.verify.outputs.schema-version }}
        run: |
          set -euo pipefail
          node scripts/write-image-attestation.mjs viewer-image-attestation.json
          sha256sum viewer-image-attestation.json > viewer-image-attestation.json.sha256
          printf 'Promoted verified immutable image `%s`\n\n' "$PUBLISHED_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          printf 'Release attestation SHA-256: `%s`\n' "$(cut -d' ' -f1 viewer-image-attestation.json.sha256)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: viewer-image-attestation-${{ github.sha }}
          path: |
            apps/viewer/viewer-image-attestation.json
            apps/viewer/viewer-image-attestation.json.sha256
          if-no-files-found: error
          retention-days: 90

  promote-latest:
    # Moves latest to the build verified above. It shares the writer concurrency group for this tag with the hand-run
    # promote-viewer.yml, so automatic and manual writes never interleave; no environment, so it never waits for approval.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: latest-writer-viewer
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check the automatic promotion pause
        id: pause
        shell: bash
        env:
          AUTO_PROMOTE_LATEST_PAUSED: ${{ vars.AUTO_PROMOTE_LATEST_PAUSED }}
        run: |
          set -euo pipefail
          # Decided first, before any registry login, registry read or API call. The value is the one GitHub supplies
          # when this job is prepared: the workflow token has no permission to read repository variables, so this is
          # not a live read at lock time. A pause therefore governs publisher runs created after it was set; see the
          # rollback steps in apps/viewer/docs/RELEASING.md for runs already in flight.
          case "$AUTO_PROMOTE_LATEST_PAUSED" in
            true)
              echo "paused=true" >> "$GITHUB_OUTPUT"
              echo "- Automatic promotion of latest is paused (AUTO_PROMOTE_LATEST_PAUSED=true); commit \`$GITHUB_SHA\` was not promoted." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Automatic promotion is paused by AUTO_PROMOTE_LATEST_PAUSED; latest was not changed." ;;
            ''|false) echo "paused=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::AUTO_PROMOTE_LATEST_PAUSED must be true, false or unset, not '$AUTO_PROMOTE_LATEST_PAUSED'. latest was not changed."; exit 1 ;;
          esac

      - name: Authenticate to GHCR to move latest
        if: steps.pause.outputs.paused == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest to this verified main build (never to an older commit)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pause.outputs.paused == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ needs.verify-and-build.outputs.image }}
          IMMUTABLE_TAG: ${{ needs.verify-and-build.outputs.image }}:sha-${{ github.sha }}
          PROMOTE_DIGEST: ${{ needs.verify-and-build.outputs.digest }}
        run: |
          set -euo pipefail
          # Like Project-Alpha, a main push moves latest in the same run that built the image, but only here: after the
          # publishing job (every verify and test step) passed, to its exact digest, and only forward from whatever latest
          # names at write time. This job and the hand-run promote workflow share one writer concurrency group for this
          # tag, so the reads, compare, write and read-back below never interleave with another writer of it. A manual
          # rollback lasts until the next automatic write; to keep one, follow the rollback steps in RELEASING.md (pause
          # first; the pause step above decides before any registry access) or revert on main.
          fail() { echo "::error::$1 latest was not changed."; exit 1; }
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' | tr -d '"'; }
          revision_of() { docker buildx imagetools inspect "$1" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}'; }
          # Prints latest's digest, or "absent" only for the registry's exact one-line answer for this missing tag.
          # Any other failure (auth, network, rate limit, server error, other wording) returns non-zero.
          read_latest() {
            local ref="$IMAGE_NAME:latest" out line
            if out="$(digest_of "$ref" 2>"$RUNNER_TEMP/latest-error.txt")"; then printf '%s' "$out"; return 0; fi
            line="$(tr -d '\r' < "$RUNNER_TEMP/latest-error.txt" | grep . || true)"
            if [[ "$line" == "ERROR: $ref: not found" || "$line" == "ERROR: $ref: MANIFEST_UNKNOWN: manifest unknown" \
              || "$line" == "ERROR: $ref: MANIFEST_UNKNOWN: manifest unknown; map[Tag:latest]" ]]; then
              printf absent; return 0
            fi
            cat "$RUNNER_TEMP/latest-error.txt" >&2
            return 1
          }
          COMMIT="$GITHUB_SHA"
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] || fail "Only a push to main moves latest."
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$PROMOTE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "No verified commit and digest."
          [[ "$IMMUTABLE_TAG" == "$IMAGE_NAME:sha-$COMMIT" || "$IMMUTABLE_TAG" == "$IMAGE_NAME:sha-$COMMIT-full" ]] || fail "Unexpected immutable tag $IMMUTABLE_TAG."
          [[ "$(digest_of "$IMMUTABLE_TAG")" == "$PROMOTE_DIGEST" ]] || fail "$IMMUTABLE_TAG does not name the verified $PROMOTE_DIGEST."
          [[ "$(revision_of "$IMAGE_NAME@$PROMOTE_DIGEST")" == "$COMMIT" ]] || fail "The verified digest does not carry commit $COMMIT."
          PREVIOUS_DIGEST="$(read_latest)" || fail "Cannot read the current latest."
          PREVIOUS_COMMIT=none
          if [[ "$PREVIOUS_DIGEST" == "$PROMOTE_DIGEST" ]]; then
            DECISION=already-latest
          elif [[ "$PREVIOUS_DIGEST" == absent ]]; then
            DECISION=create
          else
            [[ "$PREVIOUS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "The current latest digest is malformed: $PREVIOUS_DIGEST."
            PREVIOUS_COMMIT="$(revision_of "$IMAGE_NAME@$PREVIOUS_DIGEST")" || fail "Cannot read the commit of the current latest."
            [[ "$PREVIOUS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "The current latest carries no commit label; promote it once by hand."
            # ahead: this commit descends from the one latest names now. behind: latest is already newer on main.
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$PREVIOUS_COMMIT...$COMMIT" --jq .status)" || fail "Cannot compare $PREVIOUS_COMMIT with $COMMIT."
            case "$STATUS" in
              ahead) DECISION=promote ;;
              behind) DECISION=kept-newer ;;
              *) fail "latest names $PREVIOUS_COMMIT, which is not an older main commit than $COMMIT ($STATUS)." ;;
            esac
          fi
          {
            echo "### Automatic promotion of \`$IMAGE_NAME:latest\`"
            echo "- Commit: \`$COMMIT\`"
            echo "- Digest: \`$PROMOTE_DIGEST\`"
            echo "- Previous latest: \`$PREVIOUS_DIGEST\` (commit \`$PREVIOUS_COMMIT\`)"
            echo "- Decision: $DECISION"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$DECISION" in
            kept-newer) echo "::warning::latest already names $PREVIOUS_COMMIT, which is newer on main than $COMMIT; latest is never moved back automatically."; exit 0 ;;
            already-latest) exit 0 ;;
          esac
          NOW="$(read_latest)" || fail "Cannot re-read latest before the write."
          [[ "$NOW" == "$PREVIOUS_DIGEST" ]] || fail "latest changed while this step ran (was $PREVIOUS_DIGEST, now $NOW)."
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:latest" "$IMAGE_NAME@$PROMOTE_DIGEST"
          if [[ "$(digest_of "$IMAGE_NAME:latest")" != "$PROMOTE_DIGEST" ]]; then
            echo "::error::latest could not be confirmed as $PROMOTE_DIGEST. Roll back with the manual promote workflow (previous: $PREVIOUS_DIGEST, commit $PREVIOUS_COMMIT)."
            exit 1
          fi
          echo "- Result: latest now names \`$PROMOTE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
