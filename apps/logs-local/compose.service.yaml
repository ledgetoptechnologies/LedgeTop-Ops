# Ledge Top flight logs: the service to ADD to the existing lt-ops-workers stack on the NAS (Merger's decisions).
# The NAS never builds and needs no repository checkout: it runs the PUBLISHED image, pinned by digest. The digest
# comes from the main-only publisher's receipt after the exact source is qualified and Merger admits the release.
# Nothing here is activated before pilot acceptance. (Development builds: compose.dev.yaml.)
#
# Mount: the existing App_Data parent is bind-mounted at /data. The container can therefore SEE every sibling folder
# under it; isolation is application-level only: Logs creates and opens /data/flight-logs and nothing else.
# Scratch: RAM only (/work, required to be tmpfs; the decoder refuses to run otherwise). No swap, no core dumps.
# Network: the stack's existing private network with cloudflared; NO published ports. Outbound HTTPS is needed to the
# Cloudflare Access certs, the Ops directory and the DJI API.
# Logs: tiny rotated json-file logs with event codes only (no keys, payloads, coordinates or tokens).
services:
  ledgetop-flight-logs:
    # Replace <digest> with the digest from the publisher's receipt; a digest never changes under the stack.
    image: ghcr.io/ledgetoptechnologies/logs-local@sha256:<digest>
    pull_policy: missing                # pulled once by digest; never re-pulled or rebuilt by the stack
    restart: unless-stopped             # a not-ready config (exit 78) retries with Docker's backoff
    init: true
    user: "568:568"
    stop_grace_period: 30s
    volumes:
      - /mnt/Plugins/App_Data/LedgeTop-Ops-Workers:/data
    tmpfs:
      - /work:size=192m,mode=0700,uid=568,gid=568,noexec,nosuid,nodev
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g                   # equal to mem_limit: no swap
    pids_limit: 64
    ulimits:
      core: 0
      nofile: { soft: 1024, hard: 1024 }
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "3" }
    # networks: [<the stack's existing private network shared with cloudflared>]
