<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Viewer · Ledge Top</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { --brand-orange: #ee5007; --orange-action: #cc4706; --orange-dark: #a83a05; --focus: #ee5007; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0c; color: #f5f5f5;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  form {
    width: 320px; max-width: 90vw; padding: 28px;
    background: rgba(14,14,18,0.96); border: 1px solid rgba(238,80,7,0.28);
    border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  h1 { font-size: 16px; margin: 0 0 4px; color: #fff; }
  p.sub { font-size: 13px; color: #9699a3; margin: 0 0 20px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-weight: 750; color: #fff; }
  .brand .lt-mark { width: 36px; height: 36px; flex: none; }
  .brand small { display: block; font-size: 12px; font-weight: 500; color: #9699a3; }
  label { display: block; font-size: 13px; margin-bottom: 6px; color: #d7d9de; }
  input[type=password] {
    width: 100%; padding: 10px 12px; margin-bottom: 12px;
    background: #1a1a20; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
    color: #eee; font-size: 14px; font-family: inherit;
  }
  button {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    background: var(--orange-action); color: #fff;
    font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  button:hover { background: var(--orange-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  :is(button, input):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  #msg { min-height: 18px; margin-top: 10px; font-size: 12px; color: #ff8080; }
</style>
</head>
<body>
<form id="login-form">
  <div class="brand"><svg class="lt-mark" viewBox="238.5 226 776 776" aria-hidden="true" focusable="false"><g fill="none" stroke-width="56"><path stroke="#f5f3ef" d="M273.5 655V370.5a99 99 0 0 1 99-99H605M979.5 583v274.5a99 99 0 0 1-99 99H650M605 956.5H372.5a99 99 0 0 1-99-99V703"/><path stroke="#ee5007" d="M650 271.5h230.5a99 99 0 0 1 99 99V538"/></g><path fill="#f5f3ef" d="M365 370l93 92v244h135l66 94H418l-53-54zM503 453h349l54 88H780v332l-96-100V541H563z"/></svg><span>Ledge Top<small>Viewer</small></span></div>
  <h1>Sign in</h1>
  <p class="sub">Sign in to manage projects and share links.</p>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
  <button type="submit" id="submit-btn">Sign in</button>
  <div id="msg" role="alert"></div>
</form>
<script>
  const form = document.getElementById('login-form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit-btn');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    btn.disabled = true;
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value }),
      });
      if (res.ok) {
        location.reload();
        return;
      }
      const body = await res.json().catch(() => ({}));
      msg.textContent = res.status === 429
        ? 'Too many attempts — please wait a few minutes.'
        : (body.error || 'Sign-in failed.');
    } catch (err) {
      msg.textContent = 'Could not reach the server.';
    }
    btn.disabled = false;
  });
</script>
</body>
</html>
