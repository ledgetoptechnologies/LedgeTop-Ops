<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="238.5 226 776 776"%3E%3Cg fill="none" stroke-width="56"%3E%3Cpath stroke="%23f5f3ef" d="M273.5 655V370.5a99 99 0 0 1 99-99H605M979.5 583v274.5a99 99 0 0 1-99 99H650M605 956.5H372.5a99 99 0 0 1-99-99V703"/%3E%3Cpath stroke="%23ee5007" d="M650 271.5h230.5a99 99 0 0 1 99 99V538"/%3E%3C/g%3E%3Cpath fill="%23f5f3ef" d="M365 370l93 92v244h135l66 94H418l-53-54zM503 453h349l54 88H780v332l-96-100V541H563z"/%3E%3C/svg%3E" type="image/svg+xml">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ledge Top Viewer</title>
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/workspace-management.css">
  <link rel="stylesheet" href="/workspace-transfers.css">
</head>
<body>
  <a class="skip-link" href="#workspace-content">Skip to content</a>
  <div id="workspace" class="workspace-shell">
    <aside class="workspace-nav" aria-label="Viewer workspace">
      <a class="workspace-brand" href="/workspace" aria-label="Ledge Top Viewer home">
        <svg class="brand-mark" viewBox="238.5 226 776 776" aria-hidden="true" focusable="false"><g fill="none" stroke-width="56"><path stroke="#f5f3ef" d="M273.5 655V370.5a99 99 0 0 1 99-99H605M979.5 583v274.5a99 99 0 0 1-99 99H650M605 956.5H372.5a99 99 0 0 1-99-99V703"/><path stroke="#ee5007" d="M650 271.5h230.5a99 99 0 0 1 99 99V538"/></g><path fill="#f5f3ef" d="M365 370l93 92v244h135l66 94H418l-53-54zM503 453h349l54 88H780v332l-96-100V541H563z"/></svg>
        <span><strong>Ledge Top</strong><small>Viewer</small></span>
      </a>
      <nav id="workspace-navigation"></nav>
      <div class="workspace-nav-foot">
        <span class="health-dot" id="nav-health-dot"></span>
        <span id="nav-health-label">Connecting</span>
      </div>
    </aside>
    <main class="workspace-main">
      <header class="workspace-header">
        <button id="nav-toggle" class="icon-button" aria-label="Toggle navigation">☰</button>
        <div><p class="eyebrow">3D data operations</p><h1 id="page-title">Dashboard</h1></div>
        <div class="workspace-actions">
          <button class="secondary-button background-work-indicator" id="background-work-button" aria-label="Open background work; 0 active jobs">
            <span aria-hidden="true">↻</span><span>Background</span><strong id="background-work-count">0</strong>
          </button>
          <button class="secondary-button" id="refresh-button">Refresh</button>
          <button class="primary-button" id="new-project-button">New project</button>
        </div>
      </header>
      <section id="workspace-content" tabindex="-1" aria-label="Workspace content"><div class="workspace-loading" aria-hidden="true"><div class="skeleton-strip"></div><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div></div><p class="sr-only">Loading workspace…</p></section>
      <p id="workspace-status" class="sr-only" role="status" aria-live="polite"></p>
    </main>
  </div>
  <dialog id="workspace-modal" class="workspace-modal" aria-labelledby="workspace-modal-title">
    <div id="workspace-modal-content"></div>
  </dialog>
  <div id="workspace-toast" role="status"></div>
  <script type="module" src="/workspace-projects.js"></script>
</body>
</html>
