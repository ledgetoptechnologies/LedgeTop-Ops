<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Opening… · Viewer · Ledge Top</title>
  <style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#11181d;color:#f5f3ef;font:500 1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-align:center;overflow:hidden}main{display:grid;justify-items:center;gap:1.75rem;padding:1.5rem}main::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 46%,#ee50071f 0,transparent 34rem)}svg{width:5.5rem;height:5.5rem;overflow:visible;filter:drop-shadow(0 .5rem 1.5rem #0008)}.frame{stroke-dasharray:1;stroke-dashoffset:1;animation:lt-trace 2.4s cubic-bezier(.65,0,.35,1) infinite}.accent{animation:lt-breathe 2.4s ease-in-out infinite}.letters{opacity:0;animation:lt-rise .7s .15s ease-out forwards}.bar{position:relative;width:7.5rem;height:3px;border-radius:3px;background:#f5f3ef1a;overflow:hidden}.bar::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;border-radius:inherit;background:#ee5007;animation:lt-sweep 1.4s cubic-bezier(.65,0,.35,1) infinite}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}p{margin:0;max-width:28rem}main.stopped .bar{display:none}main.stopped .frame,main.stopped .accent{animation:none;stroke-dashoffset:0;opacity:1}@keyframes lt-trace{0%{stroke-dashoffset:1}55%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}@keyframes lt-breathe{0%,100%{opacity:.45}50%{opacity:1}}@keyframes lt-rise{from{opacity:0;transform:translateY(.4rem)}to{opacity:1;transform:none}}@keyframes lt-sweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}@media (prefers-reduced-motion:reduce){.frame,.accent,.letters,.bar::after{animation:none}.frame{stroke-dashoffset:0}.letters{opacity:1}.bar::after{width:100%;opacity:.6}}</style>
</head>
<body>
  <main id="launch" role="status"><svg viewBox="238.5 226 776 776" aria-hidden="true" focusable="false"><path class="frame" fill="none" stroke="#f5f3ef" stroke-width="56" pathLength="1" d="M273.5 655V370.5a99 99 0 0 1 99-99H605M979.5 583v274.5a99 99 0 0 1-99 99H650M605 956.5H372.5a99 99 0 0 1-99-99V703"/><path class="accent" fill="none" stroke="#ee5007" stroke-width="56" pathLength="1" d="M650 271.5h230.5a99 99 0 0 1 99 99V538"/><path class="letters" fill="#f5f3ef" d="M365 370l93 92v244h135l66 94H418l-53-54zM503 453h349l54 88H780v332l-96-100V541H563z"/></svg><div class="bar" aria-hidden="true"></div><p id="status" class="sr">Opening the 3D Viewer</p></main>
  <script>
    (() => {
      const CHANNEL_PATTERN=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
      const hash=new URLSearchParams(location.hash.replace(/^#/,''));
      const channelId=hash.get('channel');
      history.replaceState(null,'',location.pathname);
      // A failure stops the animation and shows its message; loading itself has no visible words.
      const show=text=>{const status=document.querySelector('#status');status.textContent=text;status.classList.remove('sr');document.querySelector('#launch').classList.add('stopped');};
      if(!CHANNEL_PATTERN.test(channelId||'')||typeof BroadcastChannel!=='function'){
        show('Secure Viewer launch is unavailable.');
        return;
      }
      const channel=new BroadcastChannel(`ltds-viewer-review:${channelId}`);
      channel.onmessage=event=>{
        const message=event.data;
        if(message&&Object.keys(message).sort().join('\n')===['type','version'].sort().join('\n')
          &&message.version===1&&message.type==='ltds-viewer:launch-failed'){
          channel.close();
          show('Secure Viewer launch failed. Close this tab and try again.');
          return;
        }
        if(!message||Object.keys(message).sort().join('\n')!==['type','url','version'].sort().join('\n')
          ||message.version!==1||message.type !== 'ltds-viewer:navigate')return;
        let parsed;
        try{parsed=new URL(message.url)}catch{return;}
        const hashValues=new URLSearchParams(parsed.hash.replace(/^#/,''));
        const controller=hashValues.get('reviewController')||hashValues.get('launchController');
        if(parsed.origin !== location.origin||parsed.username||parsed.password
          ||!/^\/session\/[0-9a-f-]{36}$/i.test(parsed.pathname)||controller!==channelId)return;
        channel.close();
        location.replace(parsed.href);
      };
      channel.postMessage({version:1,type:'ltds-viewer:launcher-ready',channelId});
    })();
  </script>
</body>
</html>
