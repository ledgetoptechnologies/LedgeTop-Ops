# Standalone TrueNAS SCALE app for the Operations claim queue.
#
# stable advances only after the publish workflow passes its container canary.
# pull_policy applies to Compose up/redeploy, not docker restart. Replace
# the renderer token before installing this YAML. Cloudflare Access
# credentials are optional and should remain empty unless the renderer API is
# protected by an Access service-token policy.
name: ledgetop-thumbnail-queue

services:
  queue-renderer:
    image: "ghcr.io/ledgetoptechnologies/ltds-thumbnail-queue-worker:stable"
    pull_policy: always
    container_name: ltds-thumbnail-gen
    user: "568:568"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    cpus: "8.0"
    mem_limit: 10g
    stop_grace_period: 5m
    environment:
      LTDSTHUMB_API_BASE: https://incoming.ledgetopdroneservices.com/api/internal/thumbnail-renderer/v1
      LTDSTHUMB_API_TOKEN: REPLACE_WITH_RENDERER_TOKEN
      CF_ACCESS_CLIENT_ID: ""
      CF_ACCESS_CLIENT_SECRET: ""
      LTDSTHUMB_WORKER_CONCURRENCY: "4"
      LTDSTHUMB_IDLE_SECONDS: "5"
      LTDSTHUMB_RENDER_TIMEOUT_SECONDS: "600"
      LTDSTHUMB_RENDERER_VERSION: truenas-0.2.0
    tmpfs:
      - /scratch:rw,nosuid,nodev,noexec,size=4g,mode=0700,uid=568,gid=568
      - /cache:rw,nosuid,nodev,noexec,size=256m,mode=0700,uid=568,gid=568
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
