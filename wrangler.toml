name = "client-data-server"
main = "src/index.ts"
compatibility_date = "2026-07-09"
workers_dev = false
preview_urls = false

[vars]
PUBLIC_BASE_URL = "https://delivery.ledgetopdroneservices.com"
TEAM_DOMAIN = "https://REPLACE_WITH_TEAM_NAME.cloudflareaccess.com"
POLICY_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUD"
BOOTSTRAP_ADMIN_EMAIL = "beaukoltz@ledgetopdroneservices.com"

[observability]
enabled = true

[[ratelimits]]
name = "ACCESS_CODE_RATE_LIMITER"
namespace_id = "19462026"

  [ratelimits.simple]
  limit = 10
  period = 60

# R2 bucket binding — create the bucket in Cloudflare dashboard first,
# then update the bucket_name below to match.
[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "client-data"

# D1 database binding — create the database via `npx wrangler d1 create client-data`
# then update the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "client-data"
database_id = "7f40a7b7-c3ec-470e-a626-e798867f71f8"
migrations_dir = "migrations"
